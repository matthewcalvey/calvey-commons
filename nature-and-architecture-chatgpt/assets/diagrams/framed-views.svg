<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">A view changes as the observer moves</title><desc id="desc">Successive viewpoints can change apparent depth and enclosure. The diagram is an analytical exercise rather than a measured Katsura plan.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">A view changes as the observer moves</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="40" y="135" width="195" height="135" fill="white" stroke="#aaa" stroke-width="2"/><line x1="60" y1="240" x2="210" y2="165" stroke="#4279a3" stroke-width="2"/><line x1="60" y1="240" x2="210" y2="245" stroke="#4279a3" stroke-width="2"/><text x="55" y="120" font-size="22" fill="#4279a3" text-anchor="start">Approach</text><text x="55" y="299" font-size="17" fill="#202c35" text-anchor="start">distant field</text><rect x="280" y="135" width="195" height="135" fill="white" stroke="#aaa" stroke-width="2"/><line x1="300" y1="240" x2="450" y2="165" stroke="#4279a3" stroke-width="2"/><line x1="300" y1="240" x2="450" y2="245" stroke="#4279a3" stroke-width="2"/><text x="295" y="120" font-size="22" fill="#4279a3" text-anchor="start">Threshold</text><text x="295" y="299" font-size="17" fill="#202c35" text-anchor="start">compressed view</text><rect x="520" y="135" width="195" height="135" fill="white" stroke="#aaa" stroke-width="2"/><line x1="540" y1="240" x2="690" y2="165" stroke="#4279a3" stroke-width="2"/><line x1="540" y1="240" x2="690" y2="245" stroke="#4279a3" stroke-width="2"/><text x="535" y="120" font-size="22" fill="#4279a3" text-anchor="start">Pause</text><text x="535" y="299" font-size="17" fill="#202c35" text-anchor="start">seated foreground</text><rect x="760" y="135" width="195" height="135" fill="white" stroke="#aaa" stroke-width="2"/><line x1="780" y1="240" x2="930" y2="165" stroke="#4279a3" stroke-width="2"/><line x1="780" y1="240" x2="930" y2="245" stroke="#4279a3" stroke-width="2"/><text x="775" y="120" font-size="22" fill="#4279a3" text-anchor="start">Turn</text><text x="775" y="299" font-size="17" fill="#202c35" text-anchor="start">another horizon</text><text x="42" y="350" font-size="21" fill="#202c35" text-anchor="start">Compare the route at standing and seated eye levels.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>