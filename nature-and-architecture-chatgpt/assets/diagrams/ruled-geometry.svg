<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Geometry provides a method, not only an image</title><desc id="desc">Crossing straight generators suggest how ruled geometry can organize curved surfaces; this is a conceptual demonstration, not a measured vault.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Geometry provides a method, not only an image</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="55" y="104" font-size="23" fill="#4279a3" text-anchor="start">Straight generators</text><line x1="90.0" y1="145" x2="370.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="110.0" y1="145" x2="350.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="130.0" y1="145" x2="330.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="150.0" y1="145" x2="310.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="170.0" y1="145" x2="290.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="190.0" y1="145" x2="270.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="210.0" y1="145" x2="250.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="230.0" y1="145" x2="230.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="250.0" y1="145" x2="210.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="270.0" y1="145" x2="190.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="290.0" y1="145" x2="170.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="310.0" y1="145" x2="150.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="330.0" y1="145" x2="130.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="350.0" y1="145" x2="110.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><line x1="370.0" y1="145" x2="90.0" y2="310" stroke="#4279a3" stroke-width="1.4"/><text x="505" y="145" font-size="21" fill="#202c35" text-anchor="start">Straight lines can generate a</text><text x="505" y="169" font-size="21" fill="#202c35" text-anchor="start">curved surface. Geometric</text><text x="505" y="193" font-size="21" fill="#202c35" text-anchor="start">construction is a distinct</text><text x="505" y="217" font-size="21" fill="#202c35" text-anchor="start">explanation from resemblance to a</text><text x="505" y="241" font-size="21" fill="#202c35" text-anchor="start">living form.</text><text x="505" y="285" font-size="18" fill="#202c35" text-anchor="start">This two-dimensional sketch is not</text><text x="505" y="309" font-size="18" fill="#202c35" text-anchor="start">a reconstruction of the basilica</text><text x="505" y="333" font-size="18" fill="#202c35" text-anchor="start">geometry.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>