<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc"><title id="title">Avoid harm as well as adding vegetation</title><desc id="desc">Visible glass treatments and reduced unnecessary night lighting address hazards that planted landscapes alone do not resolve. Pattern spacing is intentionally unspecified.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="445" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Avoid harm as well as adding vegetation</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="70" y="130" width="350" height="180" fill="white" stroke="#4279a3" stroke-width="2"/><rect x="580" y="130" width="350" height="180" fill="white" stroke="#4279a3" stroke-width="2"/><text x="80" y="108" font-size="22" fill="#202c35" text-anchor="start">Unmarked reflective surface</text><text x="590" y="108" font-size="22" fill="#4279a3" text-anchor="start">Visible treatment to investigate</text><line x1="600" y1="135" x2="600" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="624" y1="135" x2="624" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="648" y1="135" x2="648" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="672" y1="135" x2="672" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="696" y1="135" x2="696" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="720" y1="135" x2="720" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="744" y1="135" x2="744" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="768" y1="135" x2="768" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="792" y1="135" x2="792" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="816" y1="135" x2="816" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="840" y1="135" x2="840" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="864" y1="135" x2="864" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="888" y1="135" x2="888" y2="305" stroke="#4279a3" stroke-width="2"/><line x1="912" y1="135" x2="912" y2="305" stroke="#4279a3" stroke-width="2"/><path d="M210,210 L410,210" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><path d="M530,240 L590,240" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="355" font-size="20" fill="#202c35" text-anchor="start">Vegetation beside glazing can coexist with collision risk.</text><text x="70" y="384" font-size="17" fill="#202c35" text-anchor="start">Patterns and night lighting need site-specific review; spacing is not specified here.</text><text x="35" y="425" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>