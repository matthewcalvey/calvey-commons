<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">A material claim needs a complete boundary</title><desc id="desc">Material origin alone does not establish whole-life environmental performance. Compare options providing the same function.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">A material claim needs a complete boundary</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="40" y="145" width="162" height="90" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="121" y="199" font-size="20" fill="#4279a3" text-anchor="middle">Source</text><path d="M205,190 L228,190" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="145" width="162" height="90" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="311" y="199" font-size="20" fill="#4279a3" text-anchor="middle">Make</text><path d="M395,190 L418,190" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="420" y="145" width="162" height="90" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="501" y="199" font-size="20" fill="#4279a3" text-anchor="middle">Transport</text><path d="M585,190 L608,190" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="610" y="145" width="162" height="90" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="691" y="199" font-size="20" fill="#4279a3" text-anchor="middle">Use + repair</text><path d="M775,190 L798,190" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="145" width="162" height="90" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="881" y="199" font-size="20" fill="#4279a3" text-anchor="middle">Recover</text><text x="50" y="290" font-size="21" fill="#202c35" text-anchor="start">Stored biogenic carbon is one entry in an assessment with a stated boundary,</text><text x="50" y="314" font-size="21" fill="#202c35" text-anchor="start">service life and end-of-life scenario.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>