nd="url(#arrow)"/><path d="M530,260 L530,152" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><path d="M570,149 L740,129" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="115" y="105" font-size="18" fill="#4279a3" text-anchor="start">shade and rain roof</text><text x="200" y="350" font-size="19" fill="#202c35" text-anchor="start">occupied zone</text><text x="570" y="245" font-size="18" fill="#4279a3" text-anchor="start">air path to test</text><text x="630" y="182" font-size="17" fill="#202c35" text-anchor="start">separated ceiling</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>