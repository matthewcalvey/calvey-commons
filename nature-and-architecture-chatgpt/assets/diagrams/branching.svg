<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">A botanical image and a branching support</title><desc id="desc">Representation and a proposed structural mechanism require different explanations. Arrows indicate a conceptual load path only, not a structural analysis.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="440" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">A botanical image and a branching support</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="75" y="106" font-size="23" fill="#4279a3" text-anchor="start">Representation</text><text x="550" y="106" font-size="23" fill="#4279a3" text-anchor="start">Load path to investigate</text><line x1="240" y1="295" x2="240" y2="160" stroke="#4279a3" stroke-width="4"/><path d="M240,180 Q175,125 190,165 Q208,185 240,180" fill="#e5edf2" stroke="#4279a3"/><path d="M240,220 Q175,165 190,205 Q208,225 240,220" fill="#e5edf2" stroke="#4279a3"/><path d="M240,260 Q175,205 190,245 Q208,265 240,260" fill="#e5edf2" stroke="#4279a3"/><text x="100" y="340" font-size="17" fill="#202c35" text-anchor="start">Meaning does not require structural transfer.</text><line x1="720" y1="300" x2="720" y2="225" stroke="#202c35" stroke-width="10"/><line x1="720" y1="225" x2="650" y2="165" stroke="#202c35" stroke-width="7"/><line x1="720" y1="225" x2="790" y2="165" stroke="#202c35" stroke-width="7"/><path d="M650,115 L650,157" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><path d="M790,115 L790,157" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,303 L720,345" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="380" font-size="17" fill="#202c35" text-anchor="start">Connections, material and loads remain essential.</text><text x="35" y="420" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>