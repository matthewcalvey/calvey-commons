<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Match the next step to the evidence</title><desc id="desc">A field pilot, pavilion and material sample establish different kinds of evidence. Each requires a different next test before ordinary adoption.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="460" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Match the next step to the evidence</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="45" y="100" width="230" height="48" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="60" y="131" font-size="21" fill="#4279a3" text-anchor="start">Established</text><text x="310" y="131" font-size="20" fill="#202c35" text-anchor="start">shade / repair / usable thresholds</text><rect x="45" y="168" width="230" height="48" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="60" y="199" font-size="21" fill="#4279a3" text-anchor="start">Field pilot</text><text x="310" y="199" font-size="20" fill="#202c35" text-anchor="start">algae facade with dedicated operation</text><rect x="45" y="236" width="230" height="48" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="60" y="267" font-size="21" fill="#4279a3" text-anchor="start">Prototype</text><text x="310" y="267" font-size="20" fill="#202c35" text-anchor="start">humidity-responsive pavilion skin</text><rect x="45" y="304" width="230" height="48" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="60" y="335" font-size="21" fill="#4279a3" text-anchor="start">Research</text><text x="310" y="335" font-size="20" fill="#202c35" text-anchor="start">new biological material assemblies</text><text x="45" y="400" font-size="18" fill="#202c35" text-anchor="start">2030 and 2050 are scenario horizons, not promised delivery dates.</text><text x="35" y="440" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>