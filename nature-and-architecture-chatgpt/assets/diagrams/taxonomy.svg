<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Nine relationships; no hierarchy of virtue</title><desc id="desc">The categories overlap. A cultural, experiential or symbolic value does not establish an ecological outcome.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="440" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Nine relationships; no hierarchy of virtue</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="35" y="90" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="50" y="119" font-size="22" fill="#4279a3" text-anchor="start">Represent</text><text x="50" y="150" font-size="16" fill="#202c35" text-anchor="start">symbolism and ornament</text><rect x="355" y="90" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="370" y="119" font-size="22" fill="#4279a3" text-anchor="start">Resemble</text><text x="370" y="150" font-size="16" fill="#202c35" text-anchor="start">biomorphic form</text><rect x="675" y="90" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="690" y="119" font-size="22" fill="#4279a3" text-anchor="start">Transfer</text><text x="690" y="150" font-size="16" fill="#202c35" text-anchor="start">biological functions</text><rect x="35" y="195" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="50" y="224" font-size="22" fill="#4279a3" text-anchor="start">Find form</text><text x="50" y="255" font-size="16" fill="#202c35" text-anchor="start">physical equilibrium</text><rect x="355" y="195" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="370" y="224" font-size="22" fill="#4279a3" text-anchor="start">Respond to place</text><text x="370" y="255" font-size="16" fill="#202c35" text-anchor="start">site and program</text><rect x="675" y="195" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="690" y="224" font-size="22" fill="#4279a3" text-anchor="start">Work with climate</text><text x="690" y="255" font-size="16" fill="#202c35" text-anchor="start">sun air and moisture</text><rect x="35" y="300" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="50" y="329" font-size="22" fill="#4279a3" text-anchor="start">Experience</text><text x="50" y="360" font-size="16" fill="#202c35" text-anchor="start">views materials and space</text><rect x="355" y="300" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="370" y="329" font-size="22" fill="#4279a3" text-anchor="start">Make with biology</text><text x="370" y="360" font-size="16" fill="#202c35" text-anchor="start">bio-based or living matter</text><rect x="675" y="300" width="295" height="85" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="690" y="329" font-size="22" fill="#4279a3" text-anchor="start">Support life</text><text x="690" y="360" font-size="16" fill="#202c35" text-anchor="start">habitat and stewardship</text><text x="35" y="420" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>