<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Similar plan; different environmental boundary</title><desc id="desc">Open sky and glazing create different heat, air, water and maintenance conditions. These generic sections are not reconstructions of a named building.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Similar plan; different environmental boundary</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="70" y="104" font-size="24" fill="#4279a3" text-anchor="start">Open courtyard</text><line x1="70" y1="310" x2="430" y2="310" stroke="#202c35" stroke-width="2"/><rect x="70" y="180" width="70" height="130" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><rect x="360" y="180" width="70" height="130" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><text x="182" y="159" font-size="18" fill="#4279a3" text-anchor="start">open sky</text><path d="M250,140 L250,250" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="156" y="345" font-size="16" fill="#202c35" text-anchor="start">occupied edge / center / edge</text><text x="555" y="104" font-size="24" fill="#4279a3" text-anchor="start">Glazed atrium</text><line x1="555" y1="310" x2="915" y2="310" stroke="#202c35" stroke-width="2"/><rect x="555" y="180" width="70" height="130" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><rect x="845" y="180" width="70" height="130" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><line x1="625" y1="150" x2="845" y2="150" stroke="#4279a3" stroke-width="5"/><text x="655" y="139" font-size="16" fill="#4279a3" text-anchor="start">enclosure</text><path d="M735,225 L735,168" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="641" y="345" font-size="16" fill="#202c35" text-anchor="start">occupied edge / center / edge</text><line x1="490" y1="90" x2="490" y2="360" stroke="#ddd" stroke-width="1"/><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>