<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">A planted roof is an assembly</title><desc id="desc">The order is conceptual: project-specific compatible products, details, loading and maintenance are still required.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">A planted roof is an assembly</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="80" y="120" width="400" height="30" fill="#4279a3" stroke="white" stroke-width="2"/><text x="520" y="142" font-size="19" fill="#202c35" text-anchor="start">vegetation / habitat objective</text><rect x="80" y="165" width="400" height="30" fill="#acc3d3" stroke="white" stroke-width="2"/><text x="520" y="187" font-size="19" fill="#202c35" text-anchor="start">substrate / mature and wet load</text><rect x="80" y="210" width="400" height="30" fill="#c7d7e2" stroke="white" stroke-width="2"/><text x="520" y="232" font-size="19" fill="#202c35" text-anchor="start">filter and drainage</text><rect x="80" y="255" width="400" height="30" fill="#e0e8ed" stroke="white" stroke-width="2"/><text x="520" y="277" font-size="19" fill="#202c35" text-anchor="start">root protection and waterproofing</text><rect x="80" y="300" width="400" height="30" fill="#a4adb5" stroke="white" stroke-width="2"/><text x="520" y="322" font-size="19" fill="#202c35" text-anchor="start">structure / inspection strategy</text><path d="M475,215 L905,215" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="790" y="195" font-size="17" fill="#4279a3" text-anchor="start">overflow</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical 