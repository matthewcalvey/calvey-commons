<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Storage needs a credible discharge cycle</title><desc id="desc">Thermal mass participates in a daily energy balance. This generic diagram does not reproduce Eastgate engineering or establish performance.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Storage needs a credible discharge cycle</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="70" y="107" font-size="23" fill="#4279a3" text-anchor="start">Day: limit gains</text><rect x="100" y="165" width="310" height="145" fill="white" stroke="#202c35" stroke-width="2"/><rect x="110" y="280" width="290" height="30" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><text x="168" y="265" font-size="18" fill="#202c35" text-anchor="start">thermal mass</text><line x1="70" y1="146" x2="300" y2="146" stroke="#202c35" stroke-width="6"/><path d="M175,115 L175,138" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="122" y="355" font-size="17" fill="#202c35" text-anchor="start">Shade + internal gains + occupation</text><text x="555" y="107" font-size="23" fill="#4279a3" text-anchor="start">Night: release stored heat</text><rect x="585" y="165" width="310" height="145" fill="white" stroke="#202c35" stroke-width="2"/><rect x="595" y="280" width="290" height="30" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><text x="653" y="265" font-size="18" fill="#202c35" text-anchor="start">thermal mass</text><path d="M555,235 L755,235" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><path d="M755,235 L755,145" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="577" y="355" font-size="17" fill="#202c35" text-anchor="start">Useful only when outside conditions allow</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>