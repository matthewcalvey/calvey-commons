<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">The tree and its care belong in the section</title><desc id="desc">A conceptual planter diagram identifies mature vegetation, saturated substrate, drainage and replacement access. No dimensions or loading values are implied.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">The tree and its care belong in the section</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="120" y="280" width="660" height="24" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><rect x="480" y="190" width="180" height="90" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><line x1="570" y1="190" x2="570" y2="110" stroke="#4279a3" stroke-width="6"/><ellipse cx="570" cy="117" rx="82" ry="43" fill="#e5edf2" stroke="#4279a3" stroke-width="2"/><text x="50" y="160" font-size="18" fill="#202c35" text-anchor="start">mature canopy</text><line x1="217" y1="155" x2="482" y2="122" stroke="#6a747c" stroke-width="1"/><text x="52" y="220" font-size="18" fill="#202c35" text-anchor="start">wet root zone + loading</text><line x1="270" y1="214" x2="480" y2="231" stroke="#6a747c" stroke-width="1"/><text x="700" y="160" font-size="18" fill="#202c35" text-anchor="start">replacement route</text><path d="M720,180 L640,210" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="695" y="340" font-size="17" fill="#202c35" text-anchor="start">inspectable drainage</text><path d="M651,264 L710,322" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="127" y="349" font-size="18" fill="#202c35" text-anchor="start">structure / waterproofing / safe access</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>