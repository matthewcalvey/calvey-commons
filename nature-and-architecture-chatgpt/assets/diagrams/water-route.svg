<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Water is a route, not an isolated feature</title><desc id="desc">A water feature depends on supply, storage, operation and overflow. The generic flow diagram makes those dependencies visible.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Water is a route, not an isolated feature</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="35" y="135" width="210" height="100" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="49" y="170" font-size="24" fill="#4279a3" text-anchor="start">Catchment</text><text x="49" y="204" font-size="16" fill="#202c35" text-anchor="start">source and rights</text><path d="M248,185 L271,185" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="135" width="210" height="100" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="289" y="170" font-size="24" fill="#4279a3" text-anchor="start">Storage</text><text x="289" y="204" font-size="16" fill="#202c35" text-anchor="start">quality and access</text><path d="M488,185 L511,185" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="135" width="210" height="100" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="529" y="170" font-size="24" fill="#4279a3" text-anchor="start">Experience</text><text x="529" y="204" font-size="16" fill="#202c35" text-anchor="start">pool channel or garden</text><path d="M728,185 L751,185" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="755" y="135" width="210" height="100" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="769" y="170" font-size="24" fill="#4279a3" text-anchor="start">Overflow</text><text x="769" y="204" font-size="16" fill="#202c35" text-anchor="start">safe route beyond site</text><text x="50" y="310" font-size="22" fill="#202c35" text-anchor="start">Draw upstream and downstream of the beautiful part.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>