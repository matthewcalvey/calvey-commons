<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Transforming a dwelling through its edge</title><desc id="desc">A generic dwelling, winter garden and balcony section clarifies distinct enclosure conditions. It is inspired by Grand Parc, not a measured project drawing.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Transforming a dwelling through its edge</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="80" y="145" width="410" height="175" fill="white" stroke="#202c35" stroke-width="2"/><rect x="490" y="145" width="235" height="175" fill="#e5edf2" stroke="#202c35" stroke-width="2"/><rect x="725" y="295" width="170" height="25" fill="white" stroke="#202c35" stroke-width="2"/><line x1="490" y1="145" x2="490" y2="320" stroke="#4279a3" stroke-width="4"/><line x1="725" y1="145" x2="725" y2="295" stroke="#4279a3" stroke-width="4"/><text x="120" y="215" font-size="24" fill="#202c35" text-anchor="start">existing dwelling</text><text x="518" y="215" font-size="22" fill="#4279a3" text-anchor="start">winter garden</text><text x="748" y="266" font-size="21" fill="#202c35" text-anchor="start">balcony</text><path d="M360,245 L790,245" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="95" y="360" font-size="19" fill="#202c35" text-anchor="start">Thermal boundary, operable panels and summer shading must be explicit.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>