<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc"><title id="title">Six comparisons that expose different questions</title><desc id="desc">The pairs are analytical comparisons, not rankings or claims of historical transmission.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="445" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Six comparisons that expose different questions</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="60" y="108" font-size="20" fill="#202c35" text-anchor="start">Ornament</text><line x1="330" y1="102" x2="540" y2="102" stroke="#4279a3" stroke-width="2"/><text x="585" y="108" font-size="20" fill="#202c35" text-anchor="start">Branching support</text><text x="60" y="155" font-size="20" fill="#202c35" text-anchor="start">Open courtyard</text><line x1="330" y1="149" x2="540" y2="149" stroke="#4279a3" stroke-width="2"/><text x="585" y="155" font-size="20" fill="#202c35" text-anchor="start">Glazed atrium</text><text x="60" y="202" font-size="20" fill="#202c35" text-anchor="start">Fixed shade</text><line x1="330" y1="196" x2="540" y2="196" stroke="#4279a3" stroke-width="2"/><text x="585" y="202" font-size="20" fill="#202c35" text-anchor="start">Planted facade</text><text x="60" y="249" font-size="20" fill="#202c35" text-anchor="start">Framed view</text><line x1="330" y1="243" x2="540" y2="243" stroke="#4279a3" stroke-width="2"/><text x="585" y="249" font-size="20" fill="#202c35" text-anchor="start">Interior planting</text><text x="60" y="296" font-size="20" fill="#202c35" text-anchor="start">Natural appearance</text><line x1="330" y1="290" x2="540" y2="290" stroke="#4279a3" stroke-width="2"/><text x="585" y="296" font-size="20" fill="#202c35" text-anchor="start">Biological origin</text><text x="60" y="343" font-size="20" fill="#202c35" text-anchor="start">Existing habitat</text><line x1="330" y1="337" x2="540" y2="337" stroke="#4279a3" stroke-width="2"/><text x="585" y="343" font-size="20" fill="#202c35" text-anchor="start">New greenery</text><text x="35" y="425" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>