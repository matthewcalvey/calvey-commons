<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Natural, bio-based and living are different facts</title><desc id="desc">Material origin and living status do not determine a complete environmental result. Each assembly needs its own assessment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Natural, bio-based and living are different facts</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="55" y="103" font-size="16" fill="#6a747c" text-anchor="start">ORIGIN</text><text x="310" y="103" font-size="16" fill="#6a747c" text-anchor="start">ALIVE IN USE?</text><text x="580" y="103" font-size="16" fill="#6a747c" text-anchor="start">ASSESSMENT STILL NEEDED</text><text x="55" y="150" font-size="20" fill="#202c35" text-anchor="start">Stone / mineral</text><text x="310" y="150" font-size="20" fill="#4279a3" text-anchor="start">No</text><text x="580" y="150" font-size="17" fill="#202c35" text-anchor="start">Extraction, transport, service life</text><line x1="40" y1="165" x2="960" y2="165" stroke="#ddd" stroke-width="1"/><text x="55" y="210" font-size="20" fill="#202c35" text-anchor="start">Timber / biological</text><text x="310" y="210" font-size="20" fill="#4279a3" text-anchor="start">Usually no</text><text x="580" y="210" font-size="17" fill="#202c35" text-anchor="start">Forestry, treatment, replacement</text><line x1="40" y1="225" x2="960" y2="225" stroke="#ddd" stroke-width="1"/><text x="55" y="270" font-size="20" fill="#202c35" text-anchor="start">Mycelium composite</text><text x="310" y="270" font-size="20" fill="#4279a3" text-anchor="start">Product dependent</text><text x="580" y="270" font-size="17" fill="#202c35" text-anchor="start">Processing, moisture, assembly tests</text><line x1="40" y1="285" x2="960" y2="285" stroke="#ddd" stroke-width="1"/><text x="55" y="330" font-size="20" fill="#202c35" text-anchor="start">Algae photobioreactor</text><text x="310" y="330" font-size="20" fill="#4279a3" text-anchor="start">Yes</text><text x="580" y="330" font-size="17" fill="#202c35" text-anchor="start">Nutrients, energy, cleaning, harvest</text><line x1="40" y1="345" x2="960" y2="345" stroke="#ddd" stroke-width="1"/><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>