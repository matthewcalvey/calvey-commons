<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Trace the claim through four separate links</title><desc id="desc">An intention and a measured outcome occupy different positions in the evidence chain. Missing links remain visible.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">Trace the claim through four separate links</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><rect x="35" y="120" width="210" height="105" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="50" y="154" font-size="23" fill="#4279a3" text-anchor="start">Intention</text><text x="50" y="187" font-size="16" fill="#202c35" text-anchor="start">What was proposed?</text><path d="M249,170 L272,170" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="120" width="210" height="105" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="290" y="154" font-size="23" fill="#4279a3" text-anchor="start">Translation</text><text x="290" y="187" font-size="16" fill="#202c35" text-anchor="start">What changed in the</text><text x="290" y="211" font-size="16" fill="#202c35" text-anchor="start">building?</text><path d="M489,170 L512,170" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="120" width="210" height="105" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="530" y="154" font-size="23" fill="#4279a3" text-anchor="start">Mechanism</text><text x="530" y="187" font-size="16" fill="#202c35" text-anchor="start">How should it work?</text><path d="M729,170 L752,170" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><rect x="755" y="120" width="210" height="105" fill="#e5edf2" stroke="#c8d5df" stroke-width="2"/><text x="770" y="154" font-size="23" fill="#4279a3" text-anchor="start">Outcome</text><text x="770" y="187" font-size="16" fill="#202c35" text-anchor="start">What was actually</text><text x="770" y="211" font-size="16" fill="#202c35" text-anchor="start">observed?</text><text x="45" y="282" font-size="20" fill="#202c35" text-anchor="start">A source can support one link without proving the next. Attach methods, baselines and</text><text x="45" y="306" font-size="20" fill="#202c35" text-anchor="start">limits to the outcome.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>