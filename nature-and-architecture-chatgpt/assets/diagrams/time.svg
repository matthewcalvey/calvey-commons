<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">A building has more than one clock</title><desc id="desc">Daily operation, seasonal adaptation, plant growth and renewal need different observations and responsibilities.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4279a3"/></marker></defs><rect width="1000" height="430" fill="white"/><g font-family="Arial,sans-serif"><text x="35" y="42" font-size="23" fill="#202c35" text-anchor="start">A building has more than one clock</text><line x1="35" y1="61" x2="965" y2="61" stroke="#ddd" stroke-width="1"/><text x="45" y="125" font-size="25" fill="#4279a3" text-anchor="start">Day</text><text x="45" y="164" font-size="19" fill="#202c35" text-anchor="start">sun, use, heat</text><rect x="45" y="230" width="195" height="12" fill="#e5edf2" stroke="none" stroke-width="2"/><path d="M45,265 L240,265" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="285" y="125" font-size="25" fill="#4279a3" text-anchor="start">Season</text><text x="285" y="164" font-size="19" fill="#202c35" text-anchor="start">open, shade, close</text><rect x="285" y="230" width="195" height="12" fill="#e5edf2" stroke="none" stroke-width="2"/><path d="M285,265 L480,265" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="125" font-size="25" fill="#4279a3" text-anchor="start">Years</text><text x="525" y="164" font-size="19" fill="#202c35" text-anchor="start">growth and</text><text x="525" y="188" font-size="19" fill="#202c35" text-anchor="start">weathering</text><rect x="525" y="230" width="195" height="12" fill="#e5edf2" stroke="none" stroke-width="2"/><path d="M525,265 L720,265" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="765" y="125" font-size="25" fill="#4279a3" text-anchor="start">Generations</text><text x="765" y="164" font-size="19" fill="#202c35" text-anchor="start">repair, renew, adapt</text><rect x="765" y="230" width="195" height="12" fill="#e5edf2" stroke="none" stroke-width="2"/><path d="M765,265 L960,265" fill="none" stroke="#4279a3" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="330" font-size="21" fill="#202c35" text-anchor="start">Assign a person, resource and decision to each timescale.</text><text x="35" y="410" font-size="13" fill="#6a747c" text-anchor="start">SCHEMATIC — NOT TO SCALE · analytical interpretation; no simulation</text></g></svg>