<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" role="img" aria-label="Scaled comparison of a four-hectare mosaic cultural burn against a 685-hectare hazard reduction burn.">
<rect x="360.00" y="68.00" width="190.00" height="190.00" fill="var(--hot,#C45C3E)" fill-opacity="0.14"/>
<rect x="360.00" y="68.00" width="190.00" height="190.00" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<rect x="360.00" y="68.00" width="136.01" height="136.01" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.0" stroke-dasharray="5 3"/>
<text x="492.01" y="198.01" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="end">PLANNED  351 ha</text>
<text x="360.00" y="46.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">WARRA · HAZARD REDUCTION</text>
<text x="360.00" y="60.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.0em">685 ha ACTUAL · MODERATE SEVERITY</text>
<text x="360.00" y="274.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">EXCEEDED ITS PLAN BY 334 ha</text>
<text x="360.00" y="286.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SIGNIFICANT SHRUB-COVER REDUCTION</text>
<rect x="96.00" y="243.48" width="14.52" height="14.52" fill="var(--ok,#7AB87A)" fill-opacity="0.42"/>
<rect x="96.00" y="243.48" width="14.52" height="14.52" fill="none" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<text x="96.00" y="46.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">WATTLERIDGE · CULTURAL BURN</text>
<text x="96.00" y="60.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.0em">4 ha · LOW SEVERITY · MOSAIC</text>
<line x1="116.52" y1="250.74" x2="216.00" y2="250.74" stroke="var(--ok,#7AB87A)" stroke-width="0.75"/>
<text x="220.00" y="253.74" font-family="'Space Mono',monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">4 ha, AT THE SAME SCALE</text>
<text x="96.00" y="274.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">NO SIGNIFICANT SHRUB-COVER REDUCTION</text>
<text x="96.00" y="286.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A MOSAIC, NOT A FRONT</text>
<line x1="300.00" y1="60.00" x2="300.00" y2="290.00" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="200.00" y="150.00" font-family="'Space Mono',monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.04em" text-anchor="middle">170 ×</text>
<text x="200.00" y="164.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">THE AREA</text>
<line x1="176.00" y1="172.00" x2="120.00" y2="236.00" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<path d="M120.00 236.00 L121.18 232.18 L123.63 234.33 Z" fill="var(--ink,#ECEAE3)"/>
<line x1="236.00" y1="168.00" x2="352.00" y2="120.00" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<path d="M352.00 120.00 L349.25 122.90 L348.00 119.89 Z" fill="var(--ink,#ECEAE3)"/>
<line x1="64.00" y1="312.00" x2="596.00" y2="312.00" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="64.00" y="332.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">Both squares are drawn to one area scale. One fire hit its plan; the other exceeded it by more</text>
<text x="64.00" y="346.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">than eighty times the whole of the first.</text>
<text x="64.00" y="384.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BURNS AUGUST AND OCTOBER 2015 · MCKEMEY, HUNTER, PATTERSON, SIMPSON &amp; REID 2025</text>
<text x="64.00" y="398.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SQUARES ARE AREA-TRUE; THEY ARE NOT THE SHAPE OF EITHER BURN.</text>
</svg>
