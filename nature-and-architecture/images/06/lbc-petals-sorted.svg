<text x="56.00" y="448.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">One certificate makes three different kinds of claim, and only one band can fail on evidence.</text>
<text x="56.00" y="480.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">REQUIREMENTS AS REPORTED IN FORSBERG ET AL. 2021</text>
