<text x="534.00" y="189.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">OCCUPIED ROOM</text>
<text x="64.00" y="320.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE COOL-PAINT EFFECT AT FOUR MEASUREMENT POINTS</text>
<line x1="64.00" y1="338.00" x2="596.00" y2="338.00" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="64.00" y="358.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">A surface-temperature figure and an air-temperature figure are not the same number and must</text>
<text x="64.00" y="372.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">never be interchanged. Six point six degrees on the skin is eight-tenths in the room.</text>
<text x="64.00" y="404.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MEASURED AT MALANG, INDONESIA · CITRANINGRUM ET AL. 2024</text>
</svg>
