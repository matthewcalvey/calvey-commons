<text x="186.00" y="81.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">ABOVE THE ROOF</text>
<text x="456.00" y="81.00" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" letter-spacing="0.04em">-6.6 °C</text>
<line x1="192.00" y1="124.00" x2="448.00" y2="124.00" stroke="var(--line,#32352F)" stroke-width="0.75" stroke-dasharray="2 4"/>
