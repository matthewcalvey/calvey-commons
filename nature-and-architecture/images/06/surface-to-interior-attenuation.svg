<text x="456.00" y="127.00" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" letter-spacing="0.04em">-6.3 °C</text>
<line x1="192.00" y1="174.00" x2="448.00" y2="174.00" stroke="var(--line,#32352F)" stroke-width="0.75" stroke-dasharray="2 4"/>
<circle cx="322.00" cy="174.00" r="4.40" fill="var(--dim,#B8B5AC)"/>
<text x="186.00" y="177.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">50 cm BELOW</text>
<text x="456.00" y="177.00" font-family="'Space Mono',monospace" font-size="10" fill="var(--dim,#B8B5AC)" letter-spacing="0.04em">-1.2 °C</text>
<line x1="192.00" y1="244.00" x2="448.00" y2="244.00" stroke="var(--line,#32352F)" stroke-width="0.75" stroke-dasharray="2 4"/>
