<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Annotated building section showing a cool-roof temperature reduction of six point six degrees at the outer surface diminishing to zero point eight degrees in the occupied room below.">
