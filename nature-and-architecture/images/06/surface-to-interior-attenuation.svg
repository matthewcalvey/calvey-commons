<text x="186.00" y="247.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">INDOOR AIR AT 120 cm</text>
<text x="456.00" y="247.00" font-family="'Space Mono',monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.04em">-0.8 °C</text>
<line x1="526.00" y1="78.00" x2="526.00" y2="244.00" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="520.00" y1="78.00" x2="526.00" y2="78.00" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
