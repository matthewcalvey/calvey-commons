<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-label="Ladder diagram ranking nine kinds of building performance verification from instrumented measurement down to unmeasured normative claim.">
<text x="48.00" y="44.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">STRONGEST FIRST · EACH RUNG STATES THE ACT OF VERIFICATION, WHO PERFORMS IT, AND ONE REAL EXAMPLE</text>
<line x1="62.00" y1="66.00" x2="62.00" y2="464.00" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="590.00" y1="66.00" x2="590.00" y2="464.00" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="62.00" y1="76.00" x2="590.00" y2="76.00" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<circle cx="62.00" cy="76.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--ok,#7AB87A)" stroke-width="1.2"/>
<text x="62.00" y="79.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--ok,#7AB87A)" letter-spacing="0.0em" text-anchor="middle">1</text>
<text x="80.00" y="92.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">INSTRUMENTED MEASUREMENT ON THE FINISHED BUILDING</text>
<text x="80.00" y="103.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">independent investigator; method and numbers published</text>
<text x="590.00" y="92.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em" text-anchor="end">the coheating tests · the 302-worker field study</text>
<line x1="62.00" y1="120.00" x2="590.00" y2="120.00" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<circle cx="62.00" cy="120.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--ok,#7AB87A)" stroke-width="1.2"/>
<text x="62.00" y="123.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--ok,#7AB87A)" letter-spacing="0.0em" text-anchor="middle">2</text>
<text x="80.00" y="136.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">A CONTROLLED LABORATORY EXPERIMENT</text>
<text x="80.00" y="147.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">method and numbers published</text>
<text x="590.00" y="136.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em" text-anchor="end">Allen et al. 2016</text>
<line x1="62.00" y1="164.00" x2="590.00" y2="164.00" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<circle cx="62.00" cy="164.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--ok,#7AB87A)" stroke-width="1.2"/>
<text x="62.00" y="167.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--ok,#7AB87A)" letter-spacing="0.0em" text-anchor="middle">3</text>
<text x="80.00" y="180.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">CERTIFICATION ON METERED PERFORMANCE</text>
<text x="80.00" y="191.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">over a stated occupancy, by the certifying body</text>
<text x="590.00" y="180.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em" text-anchor="end">the Living Building Challenge Energy and Water Petals</text>
<line x1="62.00" y1="208.00" x2="590.00" y2="208.00" stroke="var(--accent,#6A9CC4)" stroke-width="0.9"/>
<circle cx="62.00" cy="208.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.2"/>
<text x="62.00" y="211.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.0em" text-anchor="middle">4</text>
<text x="80.00" y="224.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">CERTIFICATION ON MEASURED COMPLIANCE</text>
<text x="80.00" y="235.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">with a single physical requirement</text>
<text x="590.00" y="224.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">the blower-door test</text>
<line x1="62.00" y1="252.00" x2="590.00" y2="252.00" stroke="var(--accent,#6A9CC4)" stroke-width="0.9"/>
<circle cx="62.00" cy="252.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.2"/>
<text x="62.00" y="255.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.0em" text-anchor="middle">5</text>
<text x="80.00" y="268.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">CERTIFICATION ON CALCULATION</text>
<text x="80.00" y="279.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">with standardised inputs</text>
<text x="590.00" y="268.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">PHPP overheating · EPC bands via RdSAP</text>
