<circle cx="62.00" cy="296.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="1.2"/>
<text x="62.00" y="299.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--dim,#B8B5AC)" letter-spacing="0.0em" text-anchor="middle">6</text>
<text x="80.00" y="312.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">DESIGN-STAGE RATING ON CREDITS AND INTENT</text>
<text x="590.00" y="312.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--dim,#B8B5AC)" letter-spacing="0.08em" text-anchor="end">the BREEAM and LEED family</text>
<line x1="62.00" y1="340.00" x2="126.00" y2="340.00" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="526.00" y1="340.00" x2="590.00" y2="340.00" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="132.00" y1="335.00" x2="146.00" y2="345.00" stroke="var(--hot,#C45C3E)" stroke-width="1.0"/>
<line x1="506.00" y1="335.00" x2="520.00" y2="345.00" stroke="var(--hot,#C45C3E)" stroke-width="1.0"/>
<circle cx="62.00" cy="340.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.2"/>
<text x="62.00" y="343.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" letter-spacing="0.0em" text-anchor="middle">7</text>
<text x="80.00" y="356.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">CONTINUOUS PUBLIC DISPLAY OF LIVE DATA</text>
<text x="80.00" y="367.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">with no durable record</text>
<text x="590.00" y="356.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="end">the Bullitt Center dashboard</text>
<line x1="62.00" y1="384.00" x2="126.00" y2="384.00" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="526.00" y1="384.00" x2="590.00" y2="384.00" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="132.00" y1="379.00" x2="146.00" y2="389.00" stroke="var(--hot,#C45C3E)" stroke-width="1.0"/>
<line x1="506.00" y1="379.00" x2="520.00" y2="389.00" stroke="var(--hot,#C45C3E)" stroke-width="1.0"/>
<circle cx="62.00" cy="384.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.2"/>
