<text x="80.00" y="400.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">A DESIGN TARGET REPORTED IN THE PERFECT TENSE</text>
<text x="590.00" y="400.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="end">the 73 kWh/m²·year figure</text>
<line x1="62.00" y1="428.00" x2="590.00" y2="428.00" stroke="var(--hot,#C45C3E)" stroke-width="0.9"/>
<circle cx="62.00" cy="428.00" r="8.50" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.2"/>
<text x="62.00" y="431.50" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" letter-spacing="0.0em" text-anchor="middle">9</text>
<text x="80.00" y="444.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">A NORMATIVE CLAIM WITH NO INSTRUMENT</text>
<text x="590.00" y="444.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="end">ecological and social regeneration as asserted</text>
<text x="590.00" y="482.00" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="end">RUNGS 7 AND 8 ARE DRAWN AS BROKEN RUNGS</text>
<line x1="48.00" y1="500.00" x2="592.00" y2="500.00" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="48.00" y="520.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">Ask what was measured, on the finished building, by whom, over how long, and where the data is</text>
<text x="48.00" y="534.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">published. If any of the five has no answer, the certificate is a statement of intent.</text>
