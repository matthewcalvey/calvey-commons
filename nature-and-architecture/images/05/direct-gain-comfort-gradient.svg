<text x="52.00" y="338.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">Overheating in a direct gain room is a place, not a temperature. At 1.52 m from the glass the globe runs</text>
<text x="52.00" y="352.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">one to seven and a half degrees above the comfort band for more than six hours, and below it at night.</text>
<text x="52.00" y="366.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">Seven metres back, the same room stays inside the band all day.</text>
