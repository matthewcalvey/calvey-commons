<text x="48.00" y="286.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">The green roof is not a cool surface. Both surfaces warmed by the same 0.7 K in twenty years.</text>
<text x="48.00" y="301.00" font-family="'Space Mono',monospace" font-size="9" fill="var(--dim,#B8B5AC)" letter-spacing="0.02em">What it did was buffer — and it delivered downward, into the layer the gravel roof let</text>
