<text x="48.0" y="244.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">UR, THE AH SITE</text>
<text x="328.0" y="244.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">c. 2000–1750 BCE</text>
<text x="48.0" y="259.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE TYPE-SITE OF THE COURTYARD HOUSE</text>
<text x="48.0" y="271.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">LEAVES OPEN WHETHER ITS COURT WAS OPEN.</text>
<text x="48.0" y="283.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WOOLLEY READ IT OPEN; MARGUERON COVERED.</text>
<line x1="344.0" y1="228.0" x2="624.0" y2="228.0" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="344.0" y="244.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">FENGCHU</text>
<text x="624.0" y="244.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">c. 12TH–11TH C. BCE</text>
<text x="344.0" y="259.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE ONE EXCAVATED FACT WITH A CLIMATE</text>
<text x="344.0" y="271.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">IN IT: THE GROUND WAS HIGHER NORTH, SO</text>
<text x="344.0" y="283.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE SOUTH END WAS RAISED. THE REST IS</text>
<text x="344.0" y="295.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">RECONSTRUCTION.</text>
<line x1="48.0" y1="484.0" x2="328.0" y2="484.0" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="48.0" y="500.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">POMPEII AND HERCULANEUM</text>
<text x="328.0" y="500.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">3RD C. BCE – 79 CE</text>
<text x="48.0" y="515.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ROOF TO SPOUTS TO BASIN TO CISTERN, WITH THE</text>
<text x="48.0" y="527.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">OVERFLOW TO THE STREET — A RAIN MACHINE WITH</text>
<text x="48.0" y="539.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A HOUSE BUILT AROUND IT.</text>
<line x1="344.0" y1="484.0" x2="624.0" y2="484.0" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="344.0" y="500.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">TEOTIHUACAN</text>
<text x="624.0" y="500.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">c. 100 BCE – 550 CE</text>
<text x="344.0" y="515.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MORE THAN TWO THOUSAND WALLED COMPOUNDS,</text>
<text x="344.0" y="527.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">LIT, AIRED AND RAINED ON THROUGH SUNKEN</text>
<text x="344.0" y="539.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">PATIOS DRAINED BY PIPES UNDER THE FLOOR.</text>
<text x="28.0" y="34.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE COURT OPEN TO THE SKY, IN FOUR CULTURES</text>
<text x="612.0" y="34.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="end">NONE HAS A MEASURED TEMPERATURE</text>
</svg>
