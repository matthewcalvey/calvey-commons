<text x="116.0" y="478.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">INVENTIONS IN SEVERAL PLACES, NOT A SINGLE LINE OF DESCENT.</text>
