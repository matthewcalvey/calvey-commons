<text x="48.0" y="218.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">ÇATALHÖYÜK</text>
<text x="328.0" y="218.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">c. 7100–5950 BCE</text>
<text x="48.0" y="233.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ONE OPENING IS DOOR, WINDOW AND CHIMNEY,</text>
<text x="48.0" y="245.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND THE HEARTH SITS UNDER IT. CARBON IN THE</text>
<text x="48.0" y="257.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">RIBS OF THE ELDERLY IS THE BEST AIR-QUALITY</text>
<text x="48.0" y="269.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EVIDENCE IN THE CHAPTER, AND IT IS SKELETAL.</text>
<line x1="344.0" y1="202.0" x2="624.0" y2="202.0" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="344.0" y="218.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">SKARA BRAE</text>
<text x="624.0" y="218.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">c. 3180–2500 BCE</text>
<text x="344.0" y="233.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE HOUSE SITS IN A MIDDEN THAT ACCUMULATED</text>
<text x="344.0" y="245.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AROUND IT. THAT THE MIDDEN INSULATED IT IS AN</text>
<text x="344.0" y="257.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">INFERENCE REPEATED SINCE CHILDE, AND NEVER</text>
<text x="344.0" y="269.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MEASURED. NO ROOF SURVIVES TO TEST.</text>
<line x1="48.0" y1="452.0" x2="328.0" y2="452.0" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="48.0" y="468.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">TWIN TREES, MESA VERDE</text>
<text x="328.0" y="468.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">CUTTING DATE AD 674</text>
<text x="48.0" y="483.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DUCT IN, DEFLECTOR, FIRE PIT, SMOKE HOLE OUT:</text>
<text x="48.0" y="495.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A DISPLACEMENT LOOP WITH ITS BAFFLE, COMPLETE</text>
<text x="48.0" y="507.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">IN PLAN AND NEVER INSTRUMENTED. IT ARRIVES</text>
<text x="48.0" y="519.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">JUST AFTER THIS CHAPTER ENDS.</text>
<line x1="344.0" y1="452.0" x2="624.0" y2="452.0" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="344.0" y="468.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">OLYNTHUS</text>
<text x="624.0" y="468.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">432–348 BCE</text>
<text x="344.0" y="483.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A 2025 SIMULATION RAN THE SUN THROUGH THE</text>
<text x="344.0" y="495.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">PLAN. AT THE WINTER SOLSTICE ONLY SOUTH-</text>
<text x="344.0" y="507.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">FACING COURTS GOT DIRECT SUN AT ALL. THE</text>
<text x="344.0" y="519.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MOTIVE WAS WINTER SUN, NOT SUMMER SHADE.</text>
<text x="28.0" y="34.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">FOUR EARLY INTERIORS IN SECTION · WHERE LIGHT, AIR AND SMOKE ENTER AND LEAVE</text>
</svg>
