<text x="58" y="214" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EVERY QUANTITY IS LEFT BLANK. NONE WAS OBTAINED: NOT A POND DEPTH, NOT A PANEL U-VALUE,</text>
<text x="58" y="226" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">NOT A ROOM TEMPERATURE, NOT A CLIMATE.</text>
<line x1="58" y1="248" x2="612" y2="248" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="264" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND WHAT IT ANSWERS, TWENTY YEARS LATE</text>
<text x="58" y="288" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">1947</text>
<text x="114" y="288" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">MIT SOLAR HOUSE II FINDS THAT WHAT IT COLLECTS BY DAY IT LOSES BY NIGHT</text>
<text x="114" y="300" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THROUGH THE SAME APERTURE.</text>
<line x1="78" y1="308" x2="78" y2="327.5" stroke="var(--mut,#8A8880)" stroke-width="1.5"/><path d="M78 332 L76.11 327.5 L79.89 327.5 Z" fill="var(--mut,#8A8880)"/>
<text x="58" y="346" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">1969</text>
<text x="114" y="346" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">HAY AND YELLOTT MAKE THE APERTURE CLOSEABLE. THE COLLECTOR BECOMES A</text>
<text x="114" y="358" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">VALVE INSTEAD OF A HOLE.</text>
<text x="58" y="382" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE PROBLEM WAS NAMED BY MEASUREMENT AND SOLVED BY GEOMETRY. NOBODY MEASURED THE SOLUTION.</text>
</svg>
