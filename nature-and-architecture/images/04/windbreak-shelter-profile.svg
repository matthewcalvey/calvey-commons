<text x="58" y="376" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE TWO DISTANCE FAMILIES MUST NOT BE AVERAGED.</text>
<text x="58" y="390" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">QUOTING THIRTY BARRIER HEIGHTS AS A DESIGN DISTANCE MISUSES A DETECTION LIMIT.</text>
