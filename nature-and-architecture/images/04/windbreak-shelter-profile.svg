<text x="58" y="342" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE CURVE SHAPES ARE SCHEMATIC. THE SOURCES GIVE DENSITY CLASSES AND DISTANCE ZONES,</text>
