<line x1="58" y1="274" x2="612" y2="274" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="290" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE SAME DEVICE AS RIO'S — AN ADJUSTABLE HORIZONTAL SHADE — SIXTEEN YEARS LATER,</text>
<text x="58" y="304" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">WITH THE OCCUPANT'S AGENCY REMOVED.</text>
<text x="58" y="326" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">RIO GAVE THE OFFICE WORKER A LEVER AND A CONTINUOUS RANGE. SEAGRAM GAVE THREE DETENTS,</text>
<text x="58" y="338" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SO THAT THE ELEVATION WOULD READ UNIFORMLY TO PEOPLE WHO ARE NOT IN THE BUILDING.</text>
<text x="58" y="358" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE INTERIOR IS ADJUSTED FOR THE BENEFIT OF THE EXTERIOR.</text>
</svg>
