<text x="300" y="110" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">THE REPAIR</text>
<text x="300" y="122" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">ADDS BACK</text>
<text x="300" y="134" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">SHADE AND</text>
<text x="300" y="146" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">OPENABILITY</text>
<line x1="58" y1="314" x2="612" y2="314" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="328" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">SHADE AND OPENABILITY ARE THE TWO DEVICES THE ORIGINAL CONCEPT HAD REJECTED.</text>
<text x="58" y="350" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WHEN THE WINDOWS FIRST OPENED IS DISPUTED, AND ALL VERSIONS STAND:</text>
<text x="58" y="364" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">1935, AS A REMEDY</text>
<text x="248" y="364" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">AFTER THE BOMB OF 25 AUGUST 1944</text>
<text x="58" y="380" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A SUN-BREAK BETWEEN 1948 AND 1952, OR OF 1952 BY BODIANSKY WITH XENAKIS.</text>
