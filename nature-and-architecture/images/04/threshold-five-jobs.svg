<line x1="244" y1="128" x2="394" y2="128" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="320" y1="74" x2="384" y2="74" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="320" y1="74" x2="320" y2="128" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
