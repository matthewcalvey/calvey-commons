<text x="430" y="200" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">6 · ALL FIVE AT ONCE</text>
<rect x="430" y="214" width="76" height="54" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="430" y1="268" x2="580" y2="268" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="506" y1="214" x2="570" y2="214" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="506" y1="214" x2="506" y2="268" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="598" y1="192" x2="570.91" y2="210.06" stroke="var(--mut,#8A8880)" stroke-width="0.75"/><path d="M568 212 L570.1 208.84 L571.73 211.28 Z" fill="var(--mut,#8A8880)"/>
<line x1="570" y1="222" x2="441.38" y2="257.08" stroke="var(--mut,#8A8880)" stroke-width="0.75"/><path d="M438 258 L440.99 255.66 L441.76 258.5 Z" fill="var(--mut,#8A8880)"/>
<line x1="530" y1="282" x2="526.35" y2="250.98" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 2"/><path d="M526 248 L527.6 250.83 L525.1 251.13 Z" fill="var(--mut,#8A8880)"/>
<line x1="546" y1="282" x2="542.35" y2="250.98" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 2"/><path d="M542 248 L543.6 250.83 L541.1 251.13 Z" fill="var(--mut,#8A8880)"/>
<line x1="562" y1="282" x2="558.35" y2="250.98" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 2"/><path d="M558 248 L559.6 250.83 L557.1 251.13 Z" fill="var(--mut,#8A8880)"/>
<rect x="506" y="218" width="64" height="40" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="510" y="238" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">CONFLICT</text>
<text x="58" y="352" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">WHERE THEY CONFLICT</text>
<text x="58" y="372" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">SHADING DEPTH AND SCREEN POROSITY BOTH CUT THE AIR SPEED ACROSS THE OPENING — AND AIR SPEED IS</text>
<text x="58" y="384" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE DOMINANT COMFORT LEVER IN WARM-HUMID CONDITIONS. DEEPER SHADE BUYS ONE JOB BY LOSING ANOTHER.</text>
<line x1="58" y1="406" x2="612" y2="406" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="424" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE DECOMPOSITION IS ANALYSIS, NOT A MEASURED FINDING. NO STUDY LOCATED SEPARATES THESE FIVE</text>
<text x="58" y="436" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">JOBS EXPERIMENTALLY FOR ANY BUILDING IN THE CHAPTER.</text>
</svg>
