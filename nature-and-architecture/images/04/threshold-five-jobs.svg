<line x1="358" y1="144" x2="354.35" y2="107.48" stroke="var(--accent,#6A9CC4)" stroke-width="0.75" stroke-dasharray="2 2"/><path d="M354 104 L355.81 107.34 L352.89 107.63 Z" fill="var(--accent,#6A9CC4)"/>
<line x1="376" y1="144" x2="372.35" y2="107.48" stroke="var(--accent,#6A9CC4)" stroke-width="0.75" stroke-dasharray="2 2"/><path d="M372 104 L373.81 107.34 L370.89 107.63 Z" fill="var(--accent,#6A9CC4)"/>
<line x1="394" y1="144" x2="390.35" y2="107.48" stroke="var(--accent,#6A9CC4)" stroke-width="0.75" stroke-dasharray="2 2"/><path d="M390 104 L391.81 107.34 L388.89 107.63 Z" fill="var(--accent,#6A9CC4)"/>
<text x="430" y="60" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">3 · KEEP DRIVING RAIN OUT</text>
<rect x="430" y="74" width="76" height="54" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="430" y1="128" x2="580" y2="128" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
