<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" role="img" aria-label="Six sections through a shaded opening showing the separate jobs a veranda or brise-soleil performs and where those jobs conflict with air movement.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">FIVE JOBS OF ONE THRESHOLD, AND WHERE THEY CONFLICT</text>
<text x="58" y="60" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">1 · EXCLUDE BEAM RADIATION</text>
<rect x="58" y="74" width="76" height="54" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="58" y1="128" x2="208" y2="128" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
