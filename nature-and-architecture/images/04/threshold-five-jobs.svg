<line x1="572" y1="60" x2="566" y2="72" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<line x1="581" y1="60" x2="575" y2="72" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<line x1="590" y1="60" x2="584" y2="72" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<line x1="599" y1="60" x2="593" y2="72" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
