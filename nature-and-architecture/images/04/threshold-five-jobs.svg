<line x1="58" y1="268" x2="208" y2="268" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="134" y1="214" x2="198" y2="214" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="134" y1="214" x2="134" y2="268" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="150" y="252" width="22" height="16" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<circle cx="180" cy="246" r="5" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="244" y="200" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">5 · CARRY DAYLIGHT DEEP IN</text>
<rect x="244" y="214" width="76" height="54" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="244" y1="268" x2="394" y2="268" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="320" y1="214" x2="384" y2="214" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="320" y1="214" x2="320" y2="268" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
