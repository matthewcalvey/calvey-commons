<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" role="img" aria-label="Bar chart of survey percentages on dissatisfaction with windowless offices above a timeline showing the towers were built first.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WHAT THE OCCUPANTS SAID, ONCE ANYONE ASKED</text>
