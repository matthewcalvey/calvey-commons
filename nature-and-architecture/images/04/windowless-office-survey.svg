<text x="58" y="406" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A NEARBY WINDOW, BRIGHTER LIGHT AND WARM COLOURS DID NOT CHANGE THE DISLIKE.</text>
