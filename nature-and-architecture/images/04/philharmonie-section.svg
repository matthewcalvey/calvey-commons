<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" role="img" aria-label="Section through a concert hall with terraced seating around a central platform, annotated on one side with landscape metaphors and on the other with acoustic devices.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">METAPHOR AT THE FRONT, PHYSICS AT THE BACK</text>
<text x="318" y="44" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">SCHAROUN'S LANGUAGE</text>
<text x="342" y="44" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">CREMER'S INSTRUMENTS</text>
<line x1="58" y1="268" x2="612" y2="268" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<rect x="284" y="256" width="92" height="12" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
