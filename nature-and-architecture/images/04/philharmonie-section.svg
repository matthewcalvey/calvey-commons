<rect x="520" y="192" width="46" height="16" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<rect x="566" y="176" width="46" height="16" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<path d="M 64 150 C 210 78 450 78 606 150" fill="none" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="330" y1="56" x2="330" y2="256" stroke="var(--line,#32352F)" stroke-width="0.75" stroke-dasharray="4 4"/>
<line x1="325" y1="88" x2="335" y2="88" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="325" y1="256" x2="335" y2="256" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="340" y="74" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">22 M OVER THE PODIUM</text>
<path d="M 376 150 q 22 14 44 0" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="398" y1="140" x2="398" y2="152" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<path d="M 446 155 q 22 14 44 0" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="468" y1="145" x2="468" y2="157" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<path d="M 516 160 q 22 14 44 0" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="538" y1="150" x2="538" y2="162" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<text x="318" y="182" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">TERRACES</text>
<text x="318" y="196" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">A VALLEY</text>
<text x="318" y="210" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">A VINEYARD</text>
<text x="318" y="224" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">A TENT</text>
<text x="342" y="182" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">FREE-HANGING HYPERBOLIC-</text>
<text x="342" y="195" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">PARABOLOID REFLECTORS</text>
<text x="342" y="208" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">PRISMATIC HELMHOLTZ RESONATORS</text>
<text x="342" y="221" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">ABSORBENT SEAT UNDERSIDES</text>
<text x="342" y="234" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NON-PARALLEL SURFACES THROUGHOUT</text>
<rect x="342" y="308" width="190" height="52" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<text x="350" y="324" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MID-FREQUENCY REVERBERATION</text>
<text x="350" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">ABOUT TWO SECONDS</text>
<rect x="128" y="308" width="190" height="52" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="223" y="337" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">UNFILLED</text>
<text x="128" y="374" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">OCCUPANCY CONDITION, FREQUENCY BANDS</text>
<text x="128" y="386" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND DATE OF MEASUREMENT</text>
<text x="342" y="374" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND OCCUPANCY IS NOT TRIVIAL: THE SEAT-UNDERSIDE</text>
<text x="342" y="386" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ABSORPTION EXISTS TO REDUCE ITS EFFECT.</text>
<line x1="58" y1="408" x2="612" y2="408" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="426" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">CLAIMED AT IMAGE, OPERATING AT MODEL — THE INVERSE OF FALLINGWATER. A METAPHOR WITH NO PERFORMANCE</text>
<text x="58" y="438" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">CLAIM ATTACHED TO IT, AND THE PERFORMANCE SEPARATELY ENGINEERED BY A NAMED ACOUSTICIAN.</text>
</svg>
