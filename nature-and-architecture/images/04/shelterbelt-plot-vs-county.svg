<line x1="472" y1="262" x2="483" y2="262" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/><path d="M488 262 L483 264.1 L483 259.9 Z" fill="var(--hot,#C45C3E)"/>
<text x="352" y="306" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE ROWS PHYSICALLY OBSTRUCTED THE CENTRE-PIVOT</text>
<text x="352" y="318" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">IRRIGATION ADOPTED IN THE 1950s.</text>
<line x1="58" y1="362" x2="612" y2="362" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="378" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THEY ANSWER DIFFERENT QUESTIONS AND NEITHER REFUTES THE OTHER.</text>
<text x="58" y="400" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE AERODYNAMICS WERE RIGHT AND THE SYSTEM-SCALE OUTCOME WAS NEGATIVE, BECAUSE IT WAS DOMINATED</text>
<text x="58" y="412" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">BY A MACHINE THAT DID NOT EXIST WHEN THE TREES WERE PLANTED IN 1935.</text>
<text x="58" y="434" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A PLOT-SCALE MEASUREMENT CANNOT SETTLE A SYSTEM-SCALE QUESTION. THAT IS THE LESSON.</text>
</svg>
