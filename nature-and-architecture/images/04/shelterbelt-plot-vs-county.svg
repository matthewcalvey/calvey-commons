<text x="352" y="218" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND CROPLAND TURNED TO PASTURE BY 1.3 TO 3.2 POINTS.</text>
