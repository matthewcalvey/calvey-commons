<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 518" role="img" aria-label="Schematic section of a house whose whole south face is a solar collector sloping at 60 degrees from a raised earth berm up to the roof, with two storage tanks in the basement and forced air rising to the rooms." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
