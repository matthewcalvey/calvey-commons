<line x1="318" y1="305" x2="318" y2="218.5" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><path d="M318 214 L319.89 218.5 L316.11 218.5 Z" fill="var(--accent,#6A9CC4)"/>
<text x="326" y="222" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">FORCED AIR</text>
<text x="326" y="234" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">TO THE ROOMS</text>
<text x="300" y="146" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE ROOMS</text>
<text x="300" y="158" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BEHIND THE COLLECTOR</text>
<text x="158" y="364" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">TWO BASEMENT TANKS, 1,500 AND 275 GALLONS · FORCED AIR · AUTOMATED CONTROLS</text>
<text x="458" y="132" font-family="&#39;Space Mono&#39;,monospace" font-size="16" fill="var(--accent,#6A9CC4)" letter-spacing="0.04em">57%</text>
<text x="458" y="150" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">OF THE BUILDING'S HEAT</text>
<text x="458" y="162" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">IN WINTER, ACROSS THREE</text>
<text x="458" y="174" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">HEATING SEASONS</text>
<text x="458" y="188" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">1959–60 TO 1961–62</text>
<text x="458" y="200" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MEASURED</text>
<text x="458" y="228" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">OCCUPIED WHILE</text>
<text x="458" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MONITORED?</text>
<text x="458" y="256" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NOT ESTABLISHED</text>
<text x="458" y="270" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WHETHER 57% IS AN</text>
<text x="458" y="282" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">INHABITED OR AN EMPTY</text>
<text x="458" y="294" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">HOUSE'S FIGURE IS UNKNOWN</text>
<line x1="58" y1="380" x2="612" y2="380" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="398" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">NOT A HOUSE WITH COLLECTORS ON IT: THE SOUTH ELEVATION IS THE COLLECTOR,</text>
<text x="58" y="411" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">AND THE ARCHITECTURE IS WHAT IS LEFT.</text>
<text x="58" y="434" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE HOUSE'S FATE · TWO ACCOUNTS, BOTH STANDING</text>
<text x="58" y="450" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">MIT LIBRARIES: SOLD TO A PRIVATE OWNER IN 1962; THE SOLAR SYSTEM REMOVED AFTER THE SALE.</text>
<text x="58" y="464" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">RINDE: THE SOLAR SYSTEM REMOVED AFTER FOUR YEARS; THE HOUSE NEVER SOLD.</text>
<line x1="58" y1="480" x2="612" y2="480" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="494" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SCHEMATIC SECTION, NOT TO SCALE · ARCHITECT LAWRENCE B. ANDERSON, ENGINEER AUSTIN WHILLIER</text>
<text x="58" y="506" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MIT LIBRARIES, SOLAR IV · RINDE 2020</text>
</svg>
