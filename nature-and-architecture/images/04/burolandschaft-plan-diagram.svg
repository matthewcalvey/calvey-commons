<text x="530" y="168" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">DRAWN AT THE</text>
<text x="530" y="180" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">SAME WEIGHT AS</text>
<text x="530" y="192" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE SCREEN AND</text>
<text x="530" y="204" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE CABINET:</text>
<text x="530" y="220" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">CONSTRUCTION,</text>
<text x="530" y="232" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">NOT FURNITURE.</text>
<line x1="58" y1="286" x2="612" y2="286" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="300" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">TESTED INSIDE THE PERIOD, AND LOST</text>
<text x="58" y="322" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">120 EMPLOYEES, SURVEYED BEFORE A CONVERSION AND NINE MONTHS AFTER:</text>
<text x="58" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">AESTHETIC VALUE</text>
<line x1="176" y1="340" x2="176" y2="330.5" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/><path d="M176 326 L177.89 330.5 L174.11 330.5 Z" fill="var(--ok,#7AB87A)"/>
<text x="186" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">UP SIGNIFICANTLY</text>
<text x="338" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">FUNCTIONAL EFFICIENCY</text>
<line x1="486" y1="332" x2="486" y2="341.5" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/><path d="M486 346 L484.11 341.5 L487.89 341.5 Z" fill="var(--hot,#C45C3E)"/>
<text x="496" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">DOWN SIGNIFICANTLY</text>
<text x="58" y="368" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">CLAIMED AT SYSTEM; EVIDENCED AT IMAGE.</text>
<text x="58" y="390" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND NO OPENED SOURCE ATTRIBUTES ANY ACOUSTIC FUNCTION TO THESE PLANTS. THE VERIFIED SOURCE</text>
<text x="58" y="402" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SAYS VISUAL BARRIER AND SPACE DEFINER ONLY, SO THE ACOUSTIC CLAIM IS NOT PRINTED AS FACT.</text>
