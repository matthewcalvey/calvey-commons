<text x="514" y="314" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">FANS AND ROOM</text>
<text x="514" y="326" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">HEATERS NOTED</text>
<line x1="58" y1="334" x2="612" y2="334" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="350" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">82 PER CENT AT PEAK AND 57 PER CENT ACROSS THREE SEASONS ARE NOT THE SAME QUANTITY.</text>
<text x="58" y="370" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE PROGRESS CURVE A READER EXPECTS IS NOT DRAWN HERE, BECAUSE THE METRIC CHANGED UNDER THE DATA.</text>
<text x="58" y="388" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND MIT BUILT SIX HOUSES UNDER THE CABOT ENDOWMENT, NOT FOUR.</text>
<text x="58" y="406" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SOLAR IV: 640 SQ FT OF COLLECTOR AT 60 DEG · TANKS OF 1,500 AND 275 GALLONS.</text>
</svg>
