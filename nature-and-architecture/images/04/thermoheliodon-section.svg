<line x1="470" y1="56" x2="470" y2="300" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="486" y="74" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE CALIBRATION</text>
<text x="486" y="96" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">1955 · A NATIONAL SCIENCE</text>
<text x="486" y="108" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">FOUNDATION GRANT OF</text>
<text x="486" y="126" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">$19,000</text>
<text x="486" y="142" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">FOR TWO YEARS</text>
<text x="486" y="162" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">1957 · IT EXPIRED. THE</text>
<text x="486" y="174" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DEVICE WAS NEVER FINISHED.</text>
<text x="486" y="192" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">1963 · PUBLISHED AS AN</text>
<text x="486" y="204" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">APPENDIX ANYWAY.</text>
<rect x="486" y="220" width="120" height="34" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="546" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">NO ERROR BAR</text>
<text x="486" y="272" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE FOLLOW-ON APPLICATION</text>
<text x="486" y="284" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">TO ESTABLISH SIMILARITY</text>
<text x="486" y="296" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">CRITERIA WAS DENIED.</text>
<line x1="58" y1="344" x2="612" y2="344" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="364" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">IT SHOULD NOT BE CALLED A WORKING INSTRUMENT.</text>
<text x="58" y="384" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE PHYSICAL CRITIQUE IS THERMAL SIMILITUDE, AND IT WAS NEVER ANSWERED: NO ERROR BAR EXISTS</text>
<text x="58" y="396" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND NONE CAN NOW BE RECOVERED. THE NEXT FIGURE IS WHY.</text>
</svg>
