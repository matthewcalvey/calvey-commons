<text x="58" y="254" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">BRISE-SOLEIL</text>
<text x="58" y="266" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SHADE OUTSIDE THE GLASS</text>
<text x="434" y="50" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">HARRISON</text>
<rect x="434" y="58" width="148" height="180" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="434" y1="58" x2="582" y2="58" stroke="var(--line,#32352F)" stroke-width="0.75"/>
