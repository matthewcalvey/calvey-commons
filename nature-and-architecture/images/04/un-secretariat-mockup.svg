<text x="434" y="254" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">UNSHADED TINTED GLASS</text>
<text x="434" y="266" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE TREATMENT IN THE PANE</text>
<rect x="232" y="58" width="172" height="180" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="3 4"/>
<text x="318" y="88" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">THE FULL-SCALE MOCK-UP</text>
<text x="318" y="102" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">ERECTED ON THE ROOF OF THE</text>
<text x="318" y="114" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">MANHATTAN BUILDING, ABOUT 1948,</text>
<text x="318" y="126" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">TO SETTLE THE QUESTION</text>
<text x="318" y="170" font-family="&#39;Space Mono&#39;,monospace" font-size="15" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">NO RECORD</text>
<text x="318" y="190" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">OF WHAT IT MEASURED</text>
<text x="318" y="204" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">HAS BEEN LOCATED.</text>
<line x1="212" y1="148" x2="221.5" y2="148" stroke="var(--line,#32352F)" stroke-width="1.5"/><path d="M226 148 L221.5 149.89 L221.5 146.11 Z" fill="var(--line,#32352F)"/>
<line x1="428" y1="148" x2="414.5" y2="148" stroke="var(--line,#32352F)" stroke-width="1.5"/><path d="M410 148 L414.5 146.11 L414.5 149.89 Z" fill="var(--line,#32352F)"/>
<line x1="58" y1="286" x2="612" y2="286" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE HIGHEST-VALUE UNOPENED DOCUMENT IN THE CHAPTER IS A MEASUREMENT NOBODY CAN FIND.</text>
<text x="58" y="324" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A DISPUTE BETWEEN TWO ENVIRONMENTAL ARGUMENTS WAS SETTLED BY BUILDING THE TEST,</text>
<text x="58" y="336" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND THE RESULT LEFT NO TRACE THAT HAS BEEN RECOVERED.</text>
<text x="58" y="358" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">A CORRECTION THAT GOVERNS: THE 1950 SECRETARIAT AS BUILT WAS NOT A SEALED CURTAIN WALL.</text>
<text x="58" y="370" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">IT WAS SINGLE-PANE TINTED GLASS WITH OPERABLE DOUBLE-HUNG WINDOWS. LEVER HOUSE, 1952,</text>
<text x="58" y="382" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">IS THE BUILDING WHOSE PANES CANNOT BE OPENED.</text>
</svg>
