<text x="211.2" y="70" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">WHEN THE ROWS REACH H: DEEPEST AT 2–5H, USEFUL TO 10–12H</text>
<rect x="154.8" y="154" width="94" height="10" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1"/>
<rect x="154.8" y="154" width="28.2" height="10" fill="var(--accent,#6A9CC4)" fill-opacity="0.35" stroke="none"/>
<text x="258.8" y="162" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">IN THE FIRST YEARS: THE SAME MULTIPLES OF A SMALLER HEIGHT</text>
<line x1="58" y1="260" x2="612" y2="260" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="278" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">EVERY SHELTERED DISTANCE IS A MULTIPLE OF THE BELT'S HEIGHT.</text>
<text x="58" y="292" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">IN ITS FIRST YEARS A BELT SHELTERS A STRIP A FRACTION OF THE WIDTH THE DESIGN ASSUMES.</text>
<text x="58" y="308" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A 30-FOOT WINDBREAK PROTECTS 60 TO 300 FEET DOWNWIND, THE SAME 2H TO 10H (KAFER AND STRAIGHT).</text>
<text x="58" y="332" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE PROGRAMME · PLANTED 1935–42</text>
<text x="58" y="348" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">220 MILLION TREES IN 30,233 SHELTERBELTS BY 1942, RED CEDAR AND GREEN ASH ALONG FENCE ROWS,</text>
<text x="58" y="360" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">IN A 100-MILE BAND FROM THE CANADIAN BORDER IN NORTH DAKOTA TO THE BRAZOS RIVER IN TEXAS.</text>
<text x="58" y="372" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ANOTHER ACCOUNT: MORE THAN 200 MILLION TREES, CANADA TO ABILENE · RECORDED, NOT RESOLVED.</text>
<text x="58" y="396" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NO SURVIVAL CENSUS HAS BEEN FOUND, SO HOW MANY OF THE TREES EVER REACHED H IS UNKNOWN.</text>
<text x="58" y="410" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BY 2010 MANY BELTS IN KANSAS AND THE CENTRAL PLAINS WERE OLD, NO LONGER DELIVERING THEIR BENEFITS.</text>
<line x1="58" y1="426" x2="612" y2="426" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="440" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SECTION, NOT TO SCALE · THE YOUNG ROWS ARE DRAWN AT A QUARTER OF H, FOR ILLUSTRATION ONLY</text>
<text x="58" y="452" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">KAFER AND STRAIGHT 2022 · MISSOURI MANUAL 2024 · WIKIPEDIA, GREAT PLAINS SHELTERBELT; DUST BOWL</text>
</svg>
