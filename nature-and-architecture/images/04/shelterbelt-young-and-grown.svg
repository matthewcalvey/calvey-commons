<line x1="136" y1="214" x2="136" y2="219" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="136" y="230" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">0</text>
