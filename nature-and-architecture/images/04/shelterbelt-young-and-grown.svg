<text x="211.2" y="230" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">2H</text>
<line x1="324" y1="214" x2="324" y2="219" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="324" y="230" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">5H</text>
<line x1="512" y1="214" x2="512" y2="219" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="512" y="230" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">10H</text>
<line x1="587.2" y1="214" x2="587.2" y2="219" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="587.2" y="230" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">12H</text>
<text x="136" y="244" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DOWNWIND FROM THE BELT, IN MULTIPLES OF ITS HEIGHT H</text>
