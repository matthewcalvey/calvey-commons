<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" role="img" aria-label="Section across a shelterbelt of five young rows of cedar and ash, a dashed outline of the height the grown belt would reach, and two sheltered zones measured in multiples of height: a long one for the grown belt and a short one for the young rows." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
