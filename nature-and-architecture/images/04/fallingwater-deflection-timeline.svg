<line x1="556.63" y1="268" x2="556.63" y2="273" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="556.63" y="296" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">2010</text>
<circle cx="71.12" cy="268" r="3.2" fill="var(--ink,#ECEAE3)"/>
<line x1="71.12" y1="268" x2="71.12" y2="62" stroke="var(--ink,#ECEAE3)" stroke-width="0.75" opacity="0.55"/>
<text x="77.12" y="54" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">30 OCTOBER 1936 · CRACKS IN THE MASTER TERRACE PARAPETS</text>
<text x="77.12" y="66" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">8 DECEMBER 1936 · CRACKS CLEAR THROUGH THE MEMBERS</text>
<text x="77.12" y="78" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BEFORE COMPLETION. NO WIDTHS RECORDED.</text>
<circle cx="77.68" cy="268" r="3.2" fill="var(--hot,#C45C3E)"/>
<line x1="77.68" y1="268" x2="77.68" y2="120" stroke="var(--hot,#C45C3E)" stroke-width="0.75" opacity="0.6"/>
<text x="83.68" y="106" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">AT FORMWORK REMOVAL — TWO PUBLISHED FIGURES, BOTH STAND</text>
<text x="83.68" y="126" font-family="&#39;Space Mono&#39;,monospace" font-size="12" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">1 3/8 IN</text>
<text x="181.68" y="126" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND</text>
<text x="215.68" y="126" font-family="&#39;Space Mono&#39;,monospace" font-size="12" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">ABOUT 1.75 IN</text>
<text x="83.68" y="140" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">NEITHER SOURCE STATES WHICH MEMBER. NOT AVERAGED.</text>
<rect x="392.61" y="216" width="32.8" height="52" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="386.61" y="256" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="end">BY THE LATE 1980s</text>
<text x="386.61" y="196" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="end">7 IN AND 5.5 IN DOWN</text>
<text x="386.61" y="208" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">AT TWO TERRACE CORNERS, OVER A 15-FOOT CANTILEVER</text>
<text x="386.61" y="220" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">ABOUT TWO DEGREES OF TILT · BEAMS AT 95 PER CENT</text>
<text x="386.61" y="232" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">OF ULTIMATE, NO SAFETY FACTOR LEFT</text>
<circle cx="471.34" cy="268" r="3.2" fill="var(--ink,#ECEAE3)"/>
<text x="471.34" y="252" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">1997</text>
<rect x="468.06" y="273" width="9.84" height="9" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<circle cx="504.15" cy="268" r="3.2" fill="var(--hot,#C45C3E)"/>
<text x="504.15" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">2001–02</text>
<circle cx="576.32" cy="268" r="3.4" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="1.5"/>
<text x="576.32" y="252" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">2013 ?</text>
<text x="58" y="320" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">UPLIFT ACHIEVED, INCHES</text>
<line x1="58" y1="364" x2="258" y2="364" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="58" y1="364" x2="58" y2="368" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="58" y="379" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">0.0</text>
<line x1="124.67" y1="364" x2="124.67" y2="368" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="124.67" y="379" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">0.3</text>
<line x1="191.33" y1="364" x2="191.33" y2="368" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="191.33" y="379" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">0.6</text>
<line x1="258" y1="364" x2="258" y2="368" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="258" y="379" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">0.9</text>
<rect x="124.67" y="346" width="100" height="12" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="124.67" y1="342" x2="124.67" y2="360" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="124.67" y="338" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">0.30</text>
<line x1="169.11" y1="342" x2="169.11" y2="360" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="169.11" y="338" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">0.50</text>
<line x1="224.67" y1="342" x2="224.67" y2="360" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="224.67" y="338" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">0.75</text>
<text x="58" y="398" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THREE PUBLISHED FIGURES, A FACTOR OF 2.5 APART,</text>
<text x="58" y="410" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DRAWN AS A BRACKET AND NOT AS A POINT.</text>
<line x1="294" y1="308" x2="294" y2="410" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="310" y="318" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">1997 · SHORING UNDER THE LIVING-ROOM CANTILEVER.</text>
<text x="310" y="330" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">2001–02 · POST-TENSIONING AT 390 TONS PER GIRDER.</text>
<text x="310" y="348" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE ACCENT ON THE AXIS IS 17 MONTHS OF CRACK AND</text>
<text x="310" y="360" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">TILT METERING TO A THOUSANDTH OF AN INCH.</text>
<text x="310" y="372" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">IT SHOWED THE STRUCTURE STILL MOVING DOWN.</text>
<text x="310" y="390" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">2013 · A YEAR-LONG CAMPAIGN TO SEPARATE THERMAL FROM</text>
<text x="310" y="402" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">STRUCTURAL MOVEMENT. PUBLICATION UNFILLED.</text>
<text x="58" y="424" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NO CONTINUOUS LOGGED SERIES EXISTS BEHIND THE LONG FIGURES. THEY ARE SURVEY DIFFERENCES.</text>
<line x1="58" y1="434" x2="612" y2="434" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="448" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE INTERIOR, 1936 TO NOW</text>
<line x1="226" y1="445" x2="596" y2="445" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.8"/>
<text x="58" y="460" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">TEMPERATURE, HUMIDITY, AIR MOVEMENT, DAYLIGHT, MOULD — NOT ONE PUBLISHED MEASUREMENT.</text>
</svg>
