<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" role="img" aria-label="Timeline of Fallingwater's structural movement from 1936 to 2002 with conflicting published figures shown side by side rather than averaged.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SIXTY YEARS OF MOVEMENT, WITH ITS DISAGREEMENTS SHOWN</text>
