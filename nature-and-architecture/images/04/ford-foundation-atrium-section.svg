<text x="58" y="406" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">10 PER CENT RELATIVE HUMIDITY IN WINTER, AT PLANT LEVEL. NO INVESTIGATOR, INSTRUMENT,</text>
<text x="58" y="418" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">PERIOD OR HEIGHT IS STATED — IN A VOLUME 160 FEET TALL, WHERE STRATIFICATION IS CERTAIN.</text>
<text x="58" y="440" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">INTO IT WENT SAUCER MAGNOLIAS, WHICH NEED WINTER CHILL, AND EUCALYPTUS BROUGHT FROM</text>
<text x="58" y="452" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">CALIFORNIA. BOTH FAILED, FOR OPPOSITE REASONS. THE STATED INTENT OF THE GARDEN IS SOCIAL;</text>
<text x="58" y="464" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NO THERMAL INTENT APPEARS IN ANY NEAR-CONTEMPORARY ACCOUNT.</text>
