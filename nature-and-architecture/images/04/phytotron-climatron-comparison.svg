<text x="149" y="118" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="127" cy="89" r="2.2" fill="var(--accent,#6A9CC4)"/>
