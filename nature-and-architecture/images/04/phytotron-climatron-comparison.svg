<text x="211" y="106" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">16</text>
<text x="211" y="118" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="189" cy="89" r="2.2" fill="var(--accent,#6A9CC4)"/>
<rect x="244" y="80" width="58" height="44" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="273" y="106" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">20</text>
<text x="273" y="118" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="251" cy="89" r="2.2" fill="var(--accent,#6A9CC4)"/>
<rect x="58" y="128" width="58" height="44" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="87" y="154" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">23</text>
<text x="87" y="166" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="65" cy="137" r="2.2" fill="var(--accent,#6A9CC4)"/>
<rect x="120" y="128" width="58" height="44" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="149" y="154" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">26</text>
<text x="149" y="166" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="127" cy="137" r="2.2" fill="var(--accent,#6A9CC4)"/>
<rect x="182" y="128" width="58" height="44" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="211" y="154" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">30</text>
<text x="211" y="166" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="189" cy="137" r="2.2" fill="var(--accent,#6A9CC4)"/>
<rect x="244" y="128" width="58" height="44" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="273" y="154" font-family="&#39;Space Mono&#39;,monospace" font-size="13" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">34</text>
<text x="273" y="166" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">DEG C</text>
<circle cx="251" cy="137" r="2.2" fill="var(--accent,#6A9CC4)"/>
<text x="58" y="196" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EIGHT CELLS, EACH HELD AT ITS OWN TEMPERATURE</text>
<text x="58" y="214" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">DAY AND NIGHT AS SEPARATE REGIMES</text>
<text x="58" y="234" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">DAY</text>
<rect x="102" y="224" width="180" height="11" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="58" y="254" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--dim,#B8B5AC)" letter-spacing="0.08em">NIGHT</text>
<rect x="102" y="244" width="128" height="11" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="1.5"/>
<text x="58" y="278" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">AND THERE THE DISCOVERY WAS MADE THAT PLANTS</text>
<text x="58" y="290" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">RESPOND DIFFERENTLY TO DAY AND TO NIGHT</text>
<text x="58" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">TEMPERATURE. NOBODY PHOTOGRAPHS IT.</text>
<text x="352" y="50" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE CLIMATRON · ST LOUIS, 1960</text>
<text x="352" y="62" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">UNPARTITIONED, UNINSTRUMENTED, PHOTOGRAPHED</text>
<path d="M 360 196 A 110 110 0 0 1 580 196" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="352" y1="196" x2="588" y2="196" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="580" y1="196" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="565.26" y1="141" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="525" y1="100.74" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="470" y1="86" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="415" y1="100.74" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="374.74" y1="141" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="360" y1="196" x2="470" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<path d="M 426 196 A 44 44 0 0 1 514 196" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<path d="M 390 196 A 79 79 0 0 1 549 196" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="360" y1="210" x2="580" y2="210" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="470" y="224" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">42 METRES</text>
<text x="470" y="136" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">NO PARTITION</text>
<text x="470" y="150" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">ONE VOLUME</text>
<text x="352" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">CLAIMED: THE WORLD'S FIRST COMPLETELY</text>
<text x="352" y="252" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AIR-CONDITIONED GREENHOUSE</text>
<rect x="352" y="262" width="200" height="30" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="452" y="280" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">NO PUBLISHED DATA</text>
<text x="352" y="306" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NO CLIMATE DATA, NO LOCATED INSTRUMENT —</text>
<text x="352" y="318" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">IN A BUILDING BUILT AS A CLIMATE EXPERIMENT.</text>
<line x1="58" y1="342" x2="612" y2="342" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="358" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">ONE WON AN ARCHITECTURE PRIZE AND LEFT NO REACHABLE DATA. THE OTHER IS A WINDOWLESS</text>
<text x="58" y="370" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">RESEARCH BUILDING THAT PRODUCED THE KNOWLEDGE THE INTERIOR GARDENS WERE BUILT WITHOUT.</text>
<text x="58" y="392" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE CLIMATRON'S GEODESIC DESIGN IS BY THOMAS C. HOWARD OF SYNERGETICS.</text>
<text x="58" y="408" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WHETHER WENT LINKED THE TWO IS A QUESTION THIS CHAPTER ASKS AND CANNOT ANSWER.</text>
</svg>
