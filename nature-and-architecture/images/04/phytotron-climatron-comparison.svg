<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" role="img" aria-label="Two diagrams side by side comparing a partitioned instrumented phytotron with an unpartitioned geodesic conservatory.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">TWO ENCLOSURES FOR PLANTS, 1949 AND 1960 · AT ONE SCALE</text>
<line x1="324" y1="40" x2="324" y2="320" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="50" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE PHYTOTRON · CALTECH, 1949</text>
<text x="58" y="62" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">PARTITIONED, INSTRUMENTED, INVISIBLE</text>
