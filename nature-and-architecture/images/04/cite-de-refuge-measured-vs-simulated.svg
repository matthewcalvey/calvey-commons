<line x1="58" y1="62" x2="612" y2="62" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="51" y="65" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">35</text>
<text x="51" y="51" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">DEG C</text>
<line x1="58" y1="62" x2="58" y2="286" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<rect x="58" y="136.67" width="554" height="37.33" fill="var(--surface,#1F211E)" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="64" y="158.33" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">COMFORT 20–25</text>
<line x1="222" y1="32" x2="222" y2="364" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<line x1="468" y1="32" x2="468" y2="364" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="46" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">MEASURED · 1930s</text>
<text x="232" y="46" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">SIMULATED · DIAZ AND SOUTHALL 2015</text>
<text x="478" y="46" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">SIMULATED · RAMÍREZ-BALAS</text>
<text x="478" y="34" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">2015</text>
<rect x="96" y="76.93" width="44" height="22.4" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><text x="118" y="70.93" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">33</text><text x="118" y="112.33" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">30</text><text x="118" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">CHILDREN'S</text><text x="118" y="313" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">ROOMS</text>
<text x="62" y="56.93" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SPOT READINGS, NOT A CAMPAIGN</text>
<rect x="62" y="328" width="176" height="46" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<text x="70" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">CARBON DIOXIDE, MEASURED</text>
<text x="70" y="364" font-family="&#39;Space Mono&#39;,monospace" font-size="14" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">2,720 PPM</text>
<text x="70" y="388" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A FOURTH-FLOOR MOTHER-AND-</text>
<text x="70" y="400" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BABY ROOMETTE. THE OCCUPANTS</text>
<text x="70" y="412" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">COULD NOT LEAVE AND COULD</text>
<text x="70" y="424" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">NOT OPEN A WINDOW.</text>
<rect x="244" y="84.4" width="30" height="156.8" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/><text x="259" y="78.4" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">32</text><text x="259" y="254.2" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">11</text><text x="259" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">AS BUILT</text>
<rect x="310" y="91.87" width="30" height="0" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/><text x="325" y="85.87" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">31</text><text x="325" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="middle">AIR EXACT</text><text x="325" y="313" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">ALONE</text>
<line x1="310" y1="91.87" x2="340" y2="91.87" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="376" y="136.67" width="30" height="0" fill="var(--surface,#1F211E)" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/><text x="391" y="130.67" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ok,#7AB87A)" letter-spacing="0.08em" text-anchor="middle">25</text><text x="391" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em" text-anchor="middle">AIR EXACT</text><text x="391" y="313" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">+ BRISE-SOLEIL</text>
<line x1="391" y1="136.67" x2="391" y2="162.03" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/><path d="M391 166.53 L389.11 162.03 L392.89 162.03 Z" fill="var(--ok,#7AB87A)"/>
<text x="376" y="154.67" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">BELOW</text>
<text x="244" y="332" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ENERGY, AGAINST AS BUILT</text>
<text x="244" y="348" font-family="&#39;Space Mono&#39;,monospace" font-size="11" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">+370 TO +518%</text>
<text x="244" y="360" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AIR EXACT ALONE</text>
<text x="370" y="348" font-family="&#39;Space Mono&#39;,monospace" font-size="11" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">−65%</text>
<text x="370" y="360" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WITH THE BRISE-SOLEIL</text>
<rect x="244" y="374" width="190" height="26" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="339" y="390" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">UNFILLED</text>
<text x="244" y="414" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ANNUAL HEATING IN KWH PER M²</text>
<rect x="490" y="136.67" width="96" height="37.33" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="478" y="192" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">OPERATIVE TEMPERATURES</text>
<text x="478" y="204" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">WOULD HAVE FALLEN IN THE</text>
<text x="478" y="216" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">COMFORT RANGE, SUMMER</text>
<text x="478" y="228" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">AND WINTER BOTH.</text>
<text x="478" y="332" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A COUPLED MODEL OF WALL</text>
<text x="478" y="344" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AND AIR SYSTEM THAT</text>
<text x="478" y="356" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EVALUATES COMFORT,</text>
<text x="478" y="368" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">NOT ENERGY.</text>
<line x1="58" y1="440" x2="612" y2="440" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="456" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">1932 HAD A PHYSICAL TEST OF A PHYSICAL WALL. 2015 HAS TWO MODELS OF A WALL THAT NO LONGER</text>
<text x="58" y="468" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">EXISTS, AND CANNOT BE CALIBRATED BECAUSE NOBODY MONITORED THE BUILDING.</text>
</svg>
