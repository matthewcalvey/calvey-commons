<rect x="135.98" y="193.54" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(118.4 146 198)"/>
<rect x="113.92" y="182.27" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(142.6 123.9 186.8)"/>
<rect x="99.18" y="165.4" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(162.4 109.2 169.9)"/>
<rect x="94" y="145.5" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(180 104 150)"/>
<rect x="99.18" y="125.6" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-162.4 109.2 130.1)"/>
<rect x="113.92" y="108.73" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-142.6 123.9 113.2)"/>
<rect x="135.98" y="97.46" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-118.4 146 102)"/>
<rect x="162" y="93.5" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-90 172 98)"/>
<rect x="188.02" y="97.46" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-61.6 198 102)"/>
<rect x="210.08" y="108.73" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-37.4 220.1 113.2)"/>
<rect x="224.82" y="125.6" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(-17.6 234.8 130.1)"/>
<text x="58" y="250" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">ONE BULL</text>
<text x="58" y="262" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">FORTY-TWO DAIRY COWS</text>
<text x="58" y="274" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">TWENTY-THREE YOUNG ANIMALS</text>
<text x="58" y="294" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE ANIMALS ARE RANGED ROUND THE</text>
<text x="58" y="306" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">TABLE; THE WALL FOLLOWS THEM.</text>
<text x="348" y="46" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SECTION</text>
<path d="M348 200 L348 148 L372 104 L472 104 L496 148 L496 200" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="348" y1="148" x2="496" y2="148" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="382" y="134" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">HAY STORE ABOVE</text>
<rect x="394" y="144" width="16" height="8" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="402" y1="154" x2="402" y2="173.5" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><path d="M402 178 L400.11 173.5 L403.89 173.5 Z" fill="var(--accent,#6A9CC4)"/>
<rect x="444" y="144" width="16" height="8" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="452" y1="154" x2="452" y2="173.5" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><path d="M452 178 L450.11 173.5 L453.89 173.5 Z" fill="var(--accent,#6A9CC4)"/>
<text x="352" y="166" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">FODDER</text>
<text x="352" y="176" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">FALLS</text>
<rect x="392" y="184" width="66" height="16" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="394" y="196" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">FEED TABLE</text>
<rect x="360" y="186" width="18" height="14" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<rect x="466" y="186" width="18" height="14" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<line x1="342" y1="200" x2="504" y2="200" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="348" y="250" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">GRAVITY DOES THE WORK.</text>
<text x="348" y="262" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE SECTION IS A FEEDING MACHINE.</text>
<line x1="58" y1="326" x2="612" y2="326" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<rect x="58" y="338" width="246" height="30" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="181" y="356" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">NO DIMENSION PRINTED</text>
<text x="318" y="350" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE MONOGRAPH THAT HOLDS THEM COULD NOT BE</text>
<text x="318" y="362" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">OBTAINED, SO NONE IS GUESSED HERE.</text>
<text x="58" y="392" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE ONLY BUILDING IN THE CHAPTER WHOSE GEOMETRY IS GENERATED BY NON-HUMAN BEHAVIOUR.</text>
<text x="58" y="414" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">FORTY-SEVEN YEARS AS A WORKING DAIRY, 1926 TO 1973, AND NOT ONE MEASUREMENT OF ANYTHING</text>
<text x="58" y="426" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">WAS TAKEN INSIDE IT. IT HAS STOOD EMPTY SINCE 1976.</text>
<text x="58" y="448" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">THE BOOK'S BEST CANDIDATE FOR COMMISSIONED MONITORING.</text>
</svg>
