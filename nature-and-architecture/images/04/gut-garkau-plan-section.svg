<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-label="Plan and section of a curved brick cowshed with cattle arranged around a central feeding table and fodder dropping from the loft above.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE PLAN READ OFF THE HERD</text>
