<path d="M 92 150 C 92 92 138 66 184 66 C 238 66 262 110 254 150 C 246 198 200 224 156 220 C 112 216 92 190 92 150 Z" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<path d="M 122 148 C 122 124 152 118 182 120 C 216 122 224 156 198 168 Z" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="128" y="144" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">FEED TABLE</text>
<rect x="230" y="145.5" width="20" height="9" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75" transform="rotate(0 240 150)"/>
