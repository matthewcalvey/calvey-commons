<text x="58" y="386" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE COLUMN WAS THEN DELIBERATELY DEMOLISHED.</text>
<text x="58" y="404" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">SO THE TEST GIVES A LOWER BOUND ON CAPACITY, NOT A CAPACITY — AND FROM A SINGLE PROTOTYPE.</text>
<text x="58" y="418" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">CLAIMED AT IMAGE; OPERATES AT MODEL. ONE OF ONLY TWO BUILDINGS IN THE CHAPTER THAT EXCEED THEIR CLAIM.</text>
