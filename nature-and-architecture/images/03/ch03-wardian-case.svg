<line x1="396.73" y1="138" x2="396.73" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="396.73" y="153" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">10</text>
<line x1="445.09" y1="138" x2="445.09" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="445.09" y="153" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">20</text>
<line x1="493.45" y1="138" x2="493.45" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="493.45" y="153" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">30</text>
<line x1="541.82" y1="138" x2="541.82" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="541.82" y="153" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">40</text>
<text x="566" y="153" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">DEG C</text>
<rect x="314.51" y="120" width="227.31" height="14" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="310.51" y="131" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="end">−7</text>
<text x="547.82" y="131" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">40</text>
<text x="300" y="112" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE RANGE THE SEALED CASE CARRIED ITS PLANTS THROUGH</text>
<text x="300" y="174" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">47 KELVIN, AND THEY LIVED</text>
<line x1="58" y1="238" x2="612" y2="238" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="254" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BEFORE THE CASE · LIVINGSTONE, 1819 · CHINA TO LONDON</text>
<rect x="58" y="266" width="524" height="22" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="58" y1="266" x2="58" y2="288" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="132" y1="304" x2="64.92" y2="290.77" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/><path d="M61 290 L65.25 289.13 L64.6 292.42 Z" fill="var(--accent,#6A9CC4)"/>
<text x="136" y="307" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">ONE SURVIVOR</text>
<text x="576" y="281" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="end">ONE THOUSAND PLANTS SHIPPED</text>
<text x="58" y="324" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">DRAWN TO SCALE, THE SURVIVOR IS A HAIRLINE. THAT IS THE FIGURE.</text>
<text x="58" y="346" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AFTER THE CASE · HOOKER AT KEW</text>
<rect x="58" y="356" width="252" height="32" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="184" y="375" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">NO COUNT PUBLISHED</text>
<text x="326" y="369" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">MORE PLANTS IN FIFTEEN YEARS THAN IN THE WHOLE</text>
<text x="326" y="381" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">PRECEDING CENTURY — A RATIO, NOT A NUMBER.</text>
<text x="58" y="404" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">THE SAME CLOSED CLIMATE MOVED THE PESTS.</text>
</svg>
