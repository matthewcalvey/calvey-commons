<line x1="226" y1="96" x2="226" y2="135.5" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><path d="M226 140 L224.11 135.5 L227.89 135.5 Z" fill="var(--accent,#6A9CC4)"/>
<text x="58" y="178" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">CONDENSES ON THE GLASS, RUNS BACK TO THE SOIL</text>
<text x="58" y="191" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SEALED · NO WATERING FOR MONTHS</text>
<text x="58" y="203" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WARD'S BOTTLE HELD ABOUT FOUR YEARS, 1829</text>
<text x="58" y="220" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE CLIMATE, NOT THE STRUCTURE, WAS THE INVENTION.</text>
<text x="300" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE 47-KELVIN VOYAGE</text>
<line x1="300" y1="58" x2="612" y2="58" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<circle cx="310" cy="58" r="3.2" fill="var(--ink,#ECEAE3)"/>
<text x="310" y="49" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">JUL 1833</text>
<text x="310" y="73" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">LONDON → SYDNEY</text>
<text x="310" y="85" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">FERNS, IN GOOD CONDITION</text>
<circle cx="516" cy="58" r="3.2" fill="var(--ink,#ECEAE3)"/>
<text x="516" y="49" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">1834</text>
<text x="516" y="73" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SYDNEY → LONDON</text>
<text x="516" y="85" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">AUSTRALIAN PLANTS</text>
<line x1="300" y1="138" x2="566" y2="138" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="300" y1="138" x2="300" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="300" y="153" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">-10</text>
<line x1="348.36" y1="138" x2="348.36" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
