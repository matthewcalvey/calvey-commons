<text x="131.86" y="76.33" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">25</text>
<text x="131.86" y="90.33" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">25-MINUTE SESSIONS</text>
<line x1="292" y1="62" x2="292" y2="214" stroke="var(--ink,#ECEAE3)" stroke-width="0.75" stroke-dasharray="2 2"/>
<text x="286" y="60" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em" text-anchor="end">FULL BODY BY ABOUT DAY 15</text>
<text x="58" y="250" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE STEPS BETWEEN THE STATED DAYS ARE DRAWN DASHED:</text>
<text x="58" y="262" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE PROTOCOL IS GRADUATED, THE INTERMEDIATE VALUES UNSTATED.</text>
<text x="58" y="282" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">MAINTAINED: 2–3 HOURS IN SUMMER, 3–4 IN WINTER.</text>
<text x="58" y="296" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">AT LOW ALTITUDE, IN THE MORNING, BEFORE NINE.</text>
<line x1="322" y1="40" x2="322" y2="306" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="340" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE SECTION IT FORCES · LES FRÊNES, 1911</text>
