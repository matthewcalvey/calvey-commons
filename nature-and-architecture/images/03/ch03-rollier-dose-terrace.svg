<text x="340" y="70" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">MORNING SUN</text>
<text x="340" y="82" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">REACHES EVERY BALCONY</text>
<text x="340" y="280" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EACH BALCONY IS SET BACK SO THAT NONE</text>
<text x="340" y="292" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SHADES THE ONE BELOW.</text>
<text x="340" y="308" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE SECTION IS A CONSEQUENCE OF THE CLOCK.</text>
<line x1="58" y1="344" x2="612" y2="344" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="362" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">ROLLIER'S TALLY: 1,746 OF 2,167 RECOVERED. UNCONTROLLED, AND FOR SURGICAL TUBERCULOSIS,</text>
<text x="58" y="376" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">A DIFFERENT DISEASE FROM THE ONE THE PULMONARY SANATORIA TREATED.</text>
<text x="58" y="396" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE GENERAL SUNLIGHT CURE FOR TUBERCULOSIS FAILED. THE SPECIFIC ULTRAVIOLET CLAIM FOR RICKETS,</text>
<text x="58" y="408" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BERLIN 1918–19, WAS TRUE, AND BECAME VITAMIN D.</text>
</svg>
