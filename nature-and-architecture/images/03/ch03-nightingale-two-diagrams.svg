<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" role="img" aria-label="Two circular statistical diagrams side by side, one with narrow spikes and one with filled wedges, showing the same data.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE TWO POLAR DIAGRAMS OF 1858, AFTER HUGH SMALL'S ACCOUNT</text>
<text x="58" y="38" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE MONTHLY SERIES IS NOT REPRODUCED HERE. THIS IS THE GEOMETRY.</text>
<text x="186" y="66" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">EARLY 1858 · THE BAT'S WING</text>
<text x="186" y="79" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RADIUS IS PROPORTIONAL TO THE RATE</text>
<circle cx="186" cy="190" r="3" fill="var(--mut,#8A8880)"/>
<path d="M 186 190 L 160.02 175 A 30 30 0 0 1 172.85 163.04 Z" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="155.99" y="160.82" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RATE ×1</text>
<path d="M 186 190 L 165.48 133.62 A 60 60 0 0 1 200.52 131.78 Z" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="182.13" y="119.1" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RATE ×2</text>
<path d="M 186 190 L 216.78 105.43 A 90 90 0 0 1 258.81 137.1 Z" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="248.59" y="109.94" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RATE ×3</text>
<circle cx="186" cy="190" r="30" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75" stroke-dasharray="2 3"/>
<text x="186" y="286" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">AREA THE EYE READS</text>
<text x="186" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="12" fill="var(--hot,#C45C3E)" letter-spacing="0.08em" text-anchor="middle">1 : 4 : 9</text>
<text x="466" y="66" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">LATE 1858 · THE WEDGES</text>
<text x="466" y="79" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">AREA IS PROPORTIONAL TO THE RATE</text>
<circle cx="466" cy="190" r="3" fill="var(--mut,#8A8880)"/>
<path d="M 466 190 L 440.02 175 A 30 30 0 0 1 452.85 163.04 Z" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="435.99" y="160.82" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RATE ×1</text>
<path d="M 466 190 L 451.49 150.13 A 42.43 42.43 0 0 1 476.26 148.83 Z" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="463.05" y="136.65" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RATE ×2</text>
<path d="M 466 190 L 483.77 141.17 A 51.96 51.96 0 0 1 508.04 159.46 Z" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="505.7" y="140.32" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">RATE ×3</text>
<circle cx="466" cy="190" r="30" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75" stroke-dasharray="2 3"/>
<text x="466" y="286" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">AREA THE EYE READS</text>
<text x="466" y="302" font-family="&#39;Space Mono&#39;,monospace" font-size="12" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em" text-anchor="middle">1 : 2 : 3</text>
<line x1="58" y1="330" x2="612" y2="330" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="348" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE EYE READS AREA. WHEN THE RADIUS CARRIES THE RATE, A THREEFOLD RATE LOOKS NINEFOLD.</text>
<text x="58" y="362" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">SHE REDREW IT WITHIN THE YEAR. THE SECOND DIAGRAM IS THE HONEST ONE, AND IT IS THE ONE</text>
<text x="58" y="374" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ALMOST NEVER REPRODUCED.</text>
</svg>
