<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" role="img" aria-label="A park plan with roughly half its area shaded as water storage and pipes entering from two streams, with a small before-and-after inset.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">HALF THE PARK IS WATER · 100 ACRES</text>
<rect x="58" y="46" width="340" height="196" fill="none" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<path d="M 78 186 C 118 106 208 96 268 136 C 318 170 358 196 380 222" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
