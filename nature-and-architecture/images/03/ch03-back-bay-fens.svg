<line x1="398" y1="207" x2="419.5" y2="207" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><path d="M424 207 L419.5 208.89 L419.5 205.11 Z" fill="var(--accent,#6A9CC4)"/>
<text x="406" y="196" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">WATER GATE</text>
<text x="406" y="224" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">TO THE CHARLES</text>
<text x="418" y="60" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE CONDUITS</text>
<text x="418" y="78" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">TWIN 120-INCH CULVERTS</text>
<text x="418" y="92" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">AN 84-INCH TUNNEL</text>
<text x="418" y="106" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">12 × 12 FT CHANNELS</text>
<text x="418" y="120" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">A 9 × 7 FT ELLIPTICAL TUNNEL</text>
<text x="418" y="142" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">THE PARK IS A STORM BASIN</text>
<text x="418" y="154" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">WITH A LANDSCAPE ON TOP.</text>
