<text x="58" y="394" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">NO WATER-QUALITY, FLOOD-STORAGE OR ECOLOGICAL MEASUREMENT OF EITHER STATE WAS FOUND.</text>
