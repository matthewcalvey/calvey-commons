<text x="84" y="158" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">BASIN, ABOUT 30 ACRES</text>
<text x="84" y="170" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">PLUS 20 FLOODABLE ACRES</text>
<text x="290" y="72" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">USABLE PARK</text>
<text x="290" y="84" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">ABOUT 50 ACRES</text>
