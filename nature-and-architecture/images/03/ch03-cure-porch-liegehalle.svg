<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" role="img" aria-label="A cross-section of a house with a deep open porch holding a bed, and a small plan of a building whose wings angle to trap the sun.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE SARANAC LAKE CURE PORCH, TO THE SURVEY RULES</text>
<rect x="58" y="70" width="96" height="170" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="66" y="88" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">HOUSE</text>
<line x1="58" y1="196" x2="154" y2="196" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<rect x="154" y="118" width="132" height="78" fill="none" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="154" y1="196" x2="286" y2="201" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="172" y1="198" x2="172" y2="203" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="200" y1="198" x2="200" y2="203" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="228" y1="198" x2="228" y2="203" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="256" y1="198" x2="256" y2="203" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="294" y="208" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">FLOOR SLOPES AWAY,</text>
<text x="294" y="220" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">DRAIN SLOTS IN THE WAINSCOT</text>
<line x1="160" y1="124" x2="280" y2="124" stroke="var(--mut,#8A8880)" stroke-width="0.75" opacity="0.6"/>
<line x1="160" y1="133" x2="280" y2="133" stroke="var(--mut,#8A8880)" stroke-width="0.75" opacity="0.6"/>
<line x1="160" y1="142" x2="280" y2="142" stroke="var(--mut,#8A8880)" stroke-width="0.75" opacity="0.6"/>
<text x="160" y="160" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BEADBOARD LINING</text>
<rect x="176" y="180" width="74" height="16" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="1.5"/>
<rect x="176" y="170" width="14" height="10" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="176" y="164" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--dim,#B8B5AC)" letter-spacing="0.08em">A BED, TURNED IN PLACE</text>
<rect x="282" y="122" width="8" height="58" fill="var(--surface,#1F211E)" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="282" y1="141" x2="290" y2="141" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<line x1="282" y1="160" x2="290" y2="160" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<text x="294" y="138" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">SLIDING THREE-OVER-THREE</text>
<text x="294" y="150" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">TWO SIDES OPEN</text>
<line x1="154" y1="140" x2="154" y2="196" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<text x="160" y="136" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ok,#7AB87A)" letter-spacing="0.08em">45–48 IN DOORWAY, NO THRESHOLD</text>
<line x1="154" y1="222" x2="286" y2="222" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 2"/>
<text x="154" y="236" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DEPTH NOT MORE THAN 1.5 × WIDTH</text>
<line x1="58" y1="258" x2="612" y2="258" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="274" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THREE TYPES</text>
<rect x="58" y="286" width="56" height="42" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<rect x="114" y="286" width="34" height="30" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="58" y="342" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">ATTACHED</text>
<rect x="170" y="286" width="56" height="42" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<rect x="209" y="290" width="34" height="30" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="170" y="342" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">ENGAGED</text>
<rect x="282" y="286" width="56" height="42" fill="var(--surface,#1F211E)" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<rect x="304" y="294" width="34" height="30" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="282" y="342" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">INSET</text>
<text x="350" y="274" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WINSLEY · THE LIEGEHALLE AND THE SUN TRAP</text>
<line x1="350" y1="300" x2="580" y2="300" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<path d="M 432 300 L 446 286 L 484 286 L 498 300" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="350" y="314" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A 100-FOOT HALL WITH A THATCHED CENTRE</text>
<path d="M370 382 L412 348 L496 348 L538 382" fill="none" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="454" y1="330" x2="454" y2="339.5" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/><path d="M454 344 L452.11 339.5 L455.89 339.5 Z" fill="var(--accent,#6A9CC4)"/>
<text x="462" y="336" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">SUN</text>
<text x="350" y="398" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WINGS ANGLED TO TRAP IT</text>
<line x1="58" y1="418" x2="612" y2="418" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="434" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EVERY DIMENSION HERE IS A SURVEY RULE OR A BUILDING RECORD. NONE IS A MEASUREMENT OF WHAT THE PORCH DID.</text>
</svg>
