<text x="538" y="418" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">ARCHITECT</text>
<text x="58" y="434" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">HAECKEL'S PLATES REACH THE BUILDING THROUGH THREE HANDS, EACH OF WHICH ABSTRACTED.</text>
