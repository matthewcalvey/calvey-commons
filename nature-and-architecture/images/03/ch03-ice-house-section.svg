<text x="58" y="363" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">PRINTED AS STATED. THE DIMENSIONS ABOVE ARE ALSO AS STATED AND ARE NOT RECONCILED WITH IT HERE.</text>
