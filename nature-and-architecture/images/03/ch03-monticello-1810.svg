<text x="58" y="272" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE WIND VANE ON THE ROOF WAS WIRED TO A COMPASS ROSE ON THE PORTICO CEILING:</text>
<text x="58" y="284" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE WEATHER READ FROM INDOORS.</text>
