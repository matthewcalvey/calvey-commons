<text x="58" y="376" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">ONE WINTER'S ABSENCE FROM THE HOUSE AND EVERY PLANT IN THE GREENHOUSE DIED.</text>
<text x="58" y="389" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">BY ABOUT 1816 IT WAS A SITTING ROOM.</text>
