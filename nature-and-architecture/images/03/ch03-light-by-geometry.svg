<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" role="img" aria-label="Three schematic building plans showing narrow light shafts and small courtyards, one with a horse-drawn vehicle drawn inside the yard.">
<text x="58" y="24" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THREE PLANS AT ONE SCALE · 1 FOOT = 1.6 UNITS</text>
<text x="58" y="48" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE DUMBBELL LOT, NEW YORK</text>
<rect x="80" y="62" width="40" height="160" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="120" y="62" width="40" height="160" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="115.2" y="106" width="9.6" height="30" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="120" y1="62" x2="120" y2="106" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="120" y1="136" x2="120" y2="222" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="115.2" y="162" width="9.6" height="30" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="120" y1="62" x2="120" y2="162" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="120" y1="192" x2="120" y2="222" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="166" y1="96" x2="128.73" y2="110.55" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/><path d="M125 112 L128.12 108.98 L129.34 112.11 Z" fill="var(--accent,#6A9CC4)"/>
<text x="170" y="98" font-family="&#39;Space Mono&#39;,monospace" font-size="10" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">6 FT</text>
<text x="58" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">TWO LOTS, 25 × 100 FT</text>
<text x="58" y="252" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">TWO 3-FT INDENTATIONS,</text>
<text x="58" y="264" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">ONE FROM EACH LOT</text>
<text x="250" y="48" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE 1901 MINIMA</text>
<rect x="250" y="62" width="96" height="150" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="339.6" y="92" width="6.4" height="64" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="339.6" y1="92" x2="370" y2="84" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<text x="374" y="84" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">YARD</text>
<text x="374" y="96" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">4 FT DEEP</text>
<rect x="270" y="158" width="8" height="8" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<line x1="278" y1="158" x2="370" y2="144" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<text x="374" y="144" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">COURT</text>
<text x="374" y="156" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">25 SQ FT</text>
<rect x="274" y="192" width="6.19" height="6.19" fill="none" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<line x1="280.19" y1="194" x2="370" y2="190" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="374" y="190" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">INTERIOR</text>
<text x="374" y="202" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">WINDOW,</text>
<text x="374" y="214" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">15 SQ FT</text>
<text x="250" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A YARD, A COURT AND A WINDOW,</text>
<text x="250" y="252" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">EACH SET AS A BARE MINIMUM</text>
<text x="452" y="48" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE BERLIN BLOCK</text>
<rect x="452" y="62" width="150" height="150" fill="var(--surface,#1F211E)" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<rect x="512.98" y="122.98" width="28.03" height="28.03" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<circle cx="527" cy="137" r="14.02" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="0.75" stroke-dasharray="2 3"/>
<rect x="515.98" y="133" width="14" height="8" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<line x1="529.98" y1="137" x2="535.98" y2="137" stroke="var(--dim,#B8B5AC)" stroke-width="1.5"/>
<line x1="535.98" y1="133" x2="535.98" y2="141" stroke="var(--dim,#B8B5AC)" stroke-width="1.5"/>
<text x="452" y="240" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">COURT 5.34 × 5.34 M</text>
<text x="452" y="252" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A FIRE ENGINE'S TURNING CIRCLE</text>
<text x="452" y="264" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">IS THE ONLY STATED DERIVATION</text>
<rect x="58" y="278" width="120" height="26" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="118" y="294" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">NO READING</text>
<rect x="250" y="278" width="120" height="26" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="310" y="294" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">NO READING</text>
<rect x="452" y="278" width="120" height="26" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.85"/><text x="512" y="294" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em" text-anchor="middle">NO READING</text>
<line x1="58" y1="316" x2="612" y2="316" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="58" y="332" font-family="&#39;Space Mono&#39;,monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">NO ILLUMINANCE OR AIR-CHANGE MEASUREMENT WAS EVER MADE IN ANY OF THE THREE.</text>
<text x="58" y="350" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">LIGHT AND AIR WERE LEGISLATED AS GEOMETRY — A SHAFT WIDTH, A YARD DEPTH, A COURT AREA, A WINDOW AREA —</text>
<text x="58" y="362" font-family="&#39;Space Mono&#39;,monospace" font-size="8" fill="var(--mut,#8A8880)" letter-spacing="0.08em">BECAUSE GEOMETRY COULD BE INSPECTED FROM A DRAWING AND LIGHT COULD NOT.</text>
<text x="58" y="378" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" letter-spacing="0.08em">ONE DIMENSION IN THE SET IS DERIVED FROM A HORSE.</text>
</svg>
