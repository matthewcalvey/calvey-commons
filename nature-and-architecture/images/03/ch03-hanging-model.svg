<text x="310" y="410" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">ITS WEIGHT RATIO IS UNVERIFIED AND ITS DESTRUCTION</text>
<text x="310" y="422" font-family="&#39;Space Mono&#39;,monospace" font-size="8.5" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DATE IS NOT ESTABLISHED IN ANY OPENED SOURCE.</text>
