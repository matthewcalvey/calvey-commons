<text x="44" y="284" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">The unallocated remainder is the part of the total this chapter&#x27;s reading did not resolve into a named group;</text>
<text x="44" y="295" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">it is drawn open rather than assigned. What is measured here is emergence from the artefact, not whether the</text>
<text x="44" y="306" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">provision changed the abundance of any bee population. MacIvor &amp; Packer 2015.</text>
