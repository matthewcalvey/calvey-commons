<rect x="44" y="250" width="268" height="92" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="54" y="268" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">DAYS OF SAFETY</text>
<text x="54" y="284" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">HIGH-PERFORMANCE ENVELOPES CUT</text>
<text x="54" y="295" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">CUMULATIVE EXPOSURE BY MORE THAN 90 %</text>
<text x="54" y="306" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">IN SEVERAL LOCATIONS, AND RAISED DAYS</text>
<text x="54" y="317" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">OF SAFETY BY AS MUCH AS</text>
<text x="54" y="334" font-family="'Space Mono',monospace" font-size="12" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.04em">523 %</text>
<text x="112" y="334" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">— BASE OF THE RATIO UNSTATED</text>
<rect x="332" y="250" width="264" height="92" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="342" y="262" width="16" height="12" fill="url(#sim16)"/>
<rect x="342" y="262" width="16" height="12" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<text x="366" y="272" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.08em">SIMULATED</text>
<text x="342" y="294" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">NO MONITORED RESULT FROM AN</text>
<text x="342" y="305" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">OCCUPIED BUILDING WAS REACHABLE.</text>
<text x="342" y="324" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.04em">Both sources are 2026 preprints,</text>
<text x="342" y="334" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.04em">read at abstract only.</text>
<text x="44" y="56" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">PASSIVE SURVIVABILITY  ·  MADE ONLY IN THE FUTURE TENSE</text>
<text x="44" y="366" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Wijesuriya, Kishore &amp; Booten 2026; Hotchkiss, Sandoval &amp; Bazilian 2026. Three years old, unvalidated,</text>
<text x="44" y="377" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">unstandardised, and measured against a target borrowed from another discipline.</text>
</svg>
