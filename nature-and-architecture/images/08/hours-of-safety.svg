<text x="411.77" y="150" font-family="'Space Mono',monospace" font-size="10" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.04em">79 h</text>
<text x="102" y="150" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">SAFE ROOM, WINTER STORM</text>
<rect x="96" y="168" width="288.29" height="24" fill="url(#sim16)"/>
<rect x="96" y="168" width="288.29" height="24" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="0.75"/>
<text x="392.29" y="184" font-family="'Space Mono',monospace" font-size="10" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.04em">74 h</text>
