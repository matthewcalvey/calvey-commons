<text x="376.5" y="66" font-family="'Space Mono',monospace" font-size="10" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.04em">72 HOURS</text>
<text x="384.5" y="88" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">BORROWED FROM EMERGENCY-MANAGEMENT</text>
<text x="384.5" y="99" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">PLANNING.  NOT DERIVED FROM BUILDING</text>
<text x="384.5" y="110" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">PHYSICS, AND NOT FROM MORTALITY DATA.</text>
<rect x="96" y="134" width="307.77" height="24" fill="url(#sim16)"/>
