<text x="376" y="275" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">NUMBER</text>
<text x="446" y="276" font-family="'Space Mono',monospace" font-size="11" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.04em">41.7  ± 2.3</text>
<line x1="376" y1="286" x2="376" y2="298" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<path d="M 373 293 L 376 298 L 379 293" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="316" y="298" width="120" height="30" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="376" y="317" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">CLAIM</text>
<text x="536" y="132" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">THE BREAK</text>
<text x="536" y="146" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">80.6 % NET ERROR</text>
<text x="536" y="156" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">ON THE FEDERAL</text>
<text x="536" y="166" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">TEST HOUSE</text>
<text x="536" y="176" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">(CHAPTER 7)</text>
<text x="84" y="366" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">BOTH CHAINS END IN AN IDENTICALLY FORMATTED NUMBER, WITH IDENTICAL ERROR BARS.</text>
<rect x="44" y="382" width="552" height="28" fill="none" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="54" y="400" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THE OPERATIVE TEST:  WHAT PHYSICAL OBJECT DOES THIS NUMBER REFER TO?</text>
<text x="44" y="424" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">A measurement made about a model can be careful, reproducible, preregistered</text>
<text x="44" y="435" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">and benchmarked, and still refer to nothing physical.</text>
</svg>
