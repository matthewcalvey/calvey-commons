<text x="144" y="191" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">NUMBER</text>
<text x="214" y="192" font-family="'Space Mono',monospace" font-size="11" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.04em">41.7  ± 2.3</text>
