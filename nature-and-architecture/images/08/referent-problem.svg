<text x="144" y="233" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">CLAIM</text>
<rect x="316" y="88" width="120" height="30" fill="var(--surface,#1F211E)" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<text x="376" y="107" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">BUILDING</text>
<line x1="376" y1="118" x2="376" y2="121" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="365" y1="125" x2="387" y2="121" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="365" y1="129" x2="387" y2="125" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="376" y1="129" x2="376" y2="130" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<rect x="316" y="130" width="120" height="30" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="376" y="149" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
<line x1="376" y1="160" x2="376" y2="172" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<path d="M 373 167 L 376 172 L 379 167" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="316" y="172" width="120" height="30" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="376" y="191" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">EMULATOR</text>
