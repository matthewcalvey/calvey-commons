<path d="M 373 209 L 376 214 L 379 209" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="316" y="214" width="120" height="30" fill="var(--surface,#1F211E)" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="376" y="233" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">CONTROLLER</text>
<line x1="376" y1="244" x2="376" y2="256" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<path d="M 373 251 L 376 256 L 379 251" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round"/>
