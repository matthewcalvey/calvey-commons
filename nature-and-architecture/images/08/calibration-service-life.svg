<text x="502" y="238" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">BETWEEN THEM,</text>
<text x="502" y="248" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">UNRESOLVED.</text>
<text x="44" y="58" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">WHAT A SENSOR&#x27;S CALIBRATION IS WORTH, AND FOR HOW LONG</text>
<text x="44" y="300" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">A calibration is not a property of a sensor; it is a property of a sensor, a place and a season, and it expires.</text>
<text x="44" y="311" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Nothing in the reachable record says how many sensors in a monitored building are still calibrated and logging</text>
<text x="44" y="322" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">at year five — chapter 7 calls that the most useful unmeasured quantity in the book. The two uncertainty figures</text>
<text x="44" y="333" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">come from two sources and are left unresolved. Zimmerman et al. 2018; Bagkis, Kassandros &amp; Karatzas 2022.</text>
</svg>
