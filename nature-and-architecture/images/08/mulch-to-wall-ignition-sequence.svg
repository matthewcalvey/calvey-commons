<text x="44" y="308" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">DECIDES THE OUTCOME.</text>
<text x="44" y="332" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Firebrands arrive in the pine-needle bed; the bed ignites by smouldering; it transitions to flaming; the flames</text>
<text x="44" y="343" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">melt the vinyl and open the moisture barrier; the OSB behind goes on smouldering by itself, including OSB that</text>
<text x="44" y="354" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">had not been pre-dried. Replacing the vinyl with fire-retardant-treated cedar shingles gave no ignition in the</text>
<text x="44" y="365" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">same test. The first five metres of landscape are a fire detail. Manzello, Suzuki &amp; Hayashi 2011.</text>
