<text x="44" y="368" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Values as reported in Leturcq 2020 and Howard et al. 2021; the 2010 meta-analysis is cited through them. A</text>
