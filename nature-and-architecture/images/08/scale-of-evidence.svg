<rect x="44" y="337" width="16" height="12" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="68" y="347" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">THE CLAIMS THAT LIVE IN THAT REGION:  A THIRTY-YEAR REFERENCE SERVICE LIFE,</text>
<text x="68" y="359" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">BUILDING-SCALE STRUCTURAL USE, IN-SERVICE DURABILITY.</text>
<text x="44" y="378" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">AND THAT REGION IS WHERE THE ARCHITECTURE IS.</text>
<text x="44" y="400" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Every measured study in the materials lane sits at small specimen size, short duration, or both. The claims the</text>
<text x="44" y="411" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">buildings carry sit in the empty region, and no line connects the two. This is the coupon-against-building gap:</text>
<text x="44" y="422" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">not a dispute between studies but a gap between where the measuring was done and where the building is.</text>
<text x="44" y="433" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Compiled from the fourteen sources read in full or at abstract in lane A, 2018–2026.</text>
</svg>
