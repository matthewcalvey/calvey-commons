<text x="54" y="355" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THE METHOD EXISTS, IT WORKS, AND IT STOPPED ONE STEP SHORT.</text>
<text x="44" y="384" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">A blind inter-team validation exercise with a resubmission stage designed to separate user error from model</text>
<text x="44" y="395" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">error — exactly the round robin daylight simulation still lacks. The trace is drawn to the four regimes the paper</text>
<text x="44" y="406" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">describes, not to published readings. Strachan, Monari, Kersken &amp; Heusler 2015.</text>
