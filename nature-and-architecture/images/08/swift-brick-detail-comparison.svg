<text x="44" y="344" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Two details at the same scale, and one measured siting rule. The thermal mechanism is chapter 8&#x27;s bat-box</text>
<text x="44" y="355" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">result carried across: a box fixed outside a continuous insulation layer is thermally decoupled from the building</text>
<text x="44" y="366" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">and tracks the sun instead. This figure carries register item 17 and the note that no study has measured the</text>
<text x="44" y="377" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">difference it draws. Siting rule from Schaub, Meffert &amp; Kerth 2016; thermal mechanism from Rueegger 2019.</text>
