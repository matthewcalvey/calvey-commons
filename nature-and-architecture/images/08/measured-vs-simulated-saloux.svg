<text x="44" y="72" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ON PRACTICAL APPLICATIONS OF ADVANCED BUILDING CONTROL</text>
<text x="44" y="348" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">The only solid measured control result in the collection is a two-to-four per cent sliver, reported at second hand</text>
