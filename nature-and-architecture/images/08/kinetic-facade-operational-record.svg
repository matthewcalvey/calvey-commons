<text x="44" y="346" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">The content of this figure is the emptiness. Broken elements at the Paris building persisted through</text>
