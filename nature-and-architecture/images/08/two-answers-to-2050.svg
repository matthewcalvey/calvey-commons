<text x="54" y="330" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">AND MOVES IT THE SAME WAY FOR BOTH BUILDINGS.</text>
<text x="44" y="356" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Three morphing tools — WeatherShift, Meteonorm, CCWorldWeatherGen — against a future typical year built from</text>
<text x="44" y="367" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">the GERICS-REMO-2015 regional model, on two 1946–1960 Roman archetypes at shape factors 0.73 and 0.46 per</text>
<text x="44" y="378" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">metre. Nothing is hidden here, and the profession has standardised on the cheaper method.</text>
<text x="44" y="389" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Tootkaboni, Ballarini, Zinzi and Corrado 2021.</text>
