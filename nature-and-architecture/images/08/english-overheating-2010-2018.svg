<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bar chart of English living-room overheating prevalence, two per cent in 2010 and fifteen per cent in 2018, with flats at thirty per cent against twelve for other dwelling types.">

<line x1="96" y1="78" x2="96" y2="244" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="96" y1="244" x2="470" y2="244" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="96" y1="244" x2="470" y2="244" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="90" y="247" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">0</text>
<line x1="96" y1="196.94" x2="470" y2="196.94" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="90" y="199.94" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">10</text>
<line x1="96" y1="149.88" x2="470" y2="149.88" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="90" y="152.88" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">20</text>
<line x1="96" y1="102.82" x2="470" y2="102.82" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="90" y="105.82" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">30</text>
<text x="90" y="62" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ENGLISH LIVING ROOMS OVERHEATING  ·  %</text>
<rect x="136" y="234.59" width="52" height="9.41" fill="var(--dim,#B8B5AC)" opacity="0.45"/>
<rect x="136" y="234.59" width="52" height="9.41" fill="none" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="162" y="227.59" font-family="'Space Mono',monospace" font-size="10" fill="var(--dim,#B8B5AC)" text-anchor="middle" letter-spacing="0.04em">2 %</text>
<text x="162" y="259" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">SUMMER</text>
<text x="162" y="269" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">2010</text>
<text x="162" y="215.59" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">0.6 M DWELLINGS</text>
<rect x="226" y="173.41" width="52" height="70.59" fill="var(--hot,#C45C3E)" opacity="0.45"/>
<rect x="226" y="173.41" width="52" height="70.59" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<text x="252" y="166.41" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" text-anchor="middle" letter-spacing="0.04em">15 %</text>
<text x="252" y="259" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">SUMMER</text>
<text x="252" y="269" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">2018</text>
<text x="252" y="154.41" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">3.6 M DWELLINGS</text>
<rect x="336" y="102.82" width="52" height="141.18" fill="var(--hot,#C45C3E)" opacity="0.45"/>
<rect x="336" y="102.82" width="52" height="141.18" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<text x="362" y="95.82" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" text-anchor="middle" letter-spacing="0.04em">30 %</text>
<text x="362" y="259" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">2018</text>
<text x="362" y="269" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">FLATS</text>
<rect x="416" y="187.53" width="52" height="56.47" fill="var(--dim,#B8B5AC)" opacity="0.45"/>
<rect x="416" y="187.53" width="52" height="56.47" fill="none" stroke="var(--dim,#B8B5AC)" stroke-width="0.75"/>
<text x="442" y="180.53" font-family="'Space Mono',monospace" font-size="10" fill="var(--dim,#B8B5AC)" text-anchor="middle" letter-spacing="0.04em">12 %</text>
<text x="442" y="259" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">2018</text>
<text x="442" y="269" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">ALL OTHER</text>
<line x1="200" y1="93.41" x2="312" y2="93.41" stroke="var(--ink,#ECEAE3)" stroke-width="0.75"/>
<text x="256" y="88.41" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">THE STEP</text>
<line x1="336" y1="88.71" x2="468" y2="88.71" stroke="var(--hot,#C45C3E)" stroke-width="0.75"/>
<text x="402" y="83.71" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="middle" letter-spacing="0.08em">FLATS ARE THE LOCUS</text>
<rect x="496" y="84" width="100" height="160" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="506" y="102" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THE CRITERIA</text>
<text x="506" y="120" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">BEDROOMS:</text>
<text x="506" y="131" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ABOVE 1 % OF</text>
<text x="506" y="142" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ANNUAL</text>
<text x="506" y="153" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">OCCUPIED HOURS</text>
<text x="506" y="164" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">OVER 26 °C</text>
<text x="506" y="186" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">LIVING ROOMS:</text>
<text x="506" y="197" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ABOVE 3 % OF</text>
<text x="506" y="208" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">OCCUPIED HOURS</text>
<text x="506" y="219" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">MAY TO</text>
<text x="506" y="230" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">SEPTEMBER</text>
<text x="44" y="300" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">2018 was England&#x27;s hottest summer on record, so the step is partly weather and partly stock, and the two</text>
<text x="44" y="311" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">cannot be separated from a prevalence figure. What the figure fixes is the magnitude — 3.6 million dwellings —</text>
<text x="44" y="322" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">and the locus: flats overheat at two and a half times the rate of everything else.</text>
<text x="44" y="333" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Lomas 2021, reporting summers 2010 and 2018.</text>
</svg>
