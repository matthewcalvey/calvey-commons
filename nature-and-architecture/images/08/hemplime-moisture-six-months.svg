<text x="44" y="356" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">The fast moisture buffering the material is sold on sits on top of a slow, one-way accumulation. Traces are drawn</text>
<text x="44" y="367" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">to the behaviour the source describes — the oscillation band, the ten-point rise, the single-day drop and its</text>
<text x="44" y="378" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">recovery — because the source gives the pattern in words and not as a published series; no individual reading is</text>
<text x="44" y="389" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">claimed. Bohn &amp; Bocco 2024, one wall, 22 December 2023 to 11 July 2024.</text>
