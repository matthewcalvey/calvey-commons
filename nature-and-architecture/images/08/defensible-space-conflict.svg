<line x1="216" y1="96" x2="216" y2="402" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="2 4"/>
<text x="219.6" y="188" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THE TWO AGREE ABOUT THE FIRST METRES AND DISAGREE</text>
<text x="219.6" y="199" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">ABOUT EVERYTHING PAST THIRTY.</text>
<text x="44" y="420" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Drawn at the same scale and deliberately not reconciled. Neither study is drawn as the correction of the other;</text>
<text x="44" y="431" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">this figure carries register item 7. Syphard, Brennan &amp; Keeley 2014; Gibbons et al. 2012.</text>
