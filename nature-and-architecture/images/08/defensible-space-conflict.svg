<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img" aria-label="Two distance scales compared, a Californian study finding defensible-space benefit saturating by twenty metres and absent past thirty, against an Australian study finding continued benefit to one hundred metres and beyond.">

