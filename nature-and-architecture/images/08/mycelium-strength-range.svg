<text x="44" y="348" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Thirty-five treatments, one species, one laboratory. The spread within them is wider than any single value the</text>
<text x="44" y="359" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">phrase ‘the compressive strength of mycelium composite’ could carry: a fifteen-fold range, 33 to 491 kPa, set by</text>
<text x="44" y="370" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">substrate and cultivation schedule. Only the two extremes and the direction of the cultivation effect are drawn</text>
<text x="44" y="381" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">from stated values; horizontal placement within a column is for legibility and is not data.</text>
<text x="44" y="392" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Ghazvinian &amp; Gürsoy 2022.</text>
</svg>
