<text x="54" y="361" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">82 PER CENT OF STUDIES WERE NORTH AMERICAN AND 90 PER CENT WERE ON MAMMALS.</text>
<text x="44" y="390" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">What is measured is road kill — mortality at the artefact — and not whether any population was made viable.</text>
<text x="44" y="401" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">This figure carries register item 16. Rytwinski et al. 2016.</text>
