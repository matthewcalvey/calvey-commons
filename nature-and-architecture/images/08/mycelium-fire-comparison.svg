<text x="52" y="342" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">THE SPECIMENS ARE MILLIGRAMS AND PLATES.  NOT ASSEMBLIES, NOT WALLS, NOT COMPARTMENTS.</text>
<text x="52" y="364" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The fire advantage at the substance scale is large and it stops at the substance. Nothing here tells you how</text>
<text x="52" y="375" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">a mycelium wall behaves in a fire, only how a milligram of mycelium behaves in a calorimeter. Jones et al. 2018.</text>
