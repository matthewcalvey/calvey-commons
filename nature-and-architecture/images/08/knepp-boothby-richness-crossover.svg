<text x="348" y="330" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THE TWO PANELS SUPPORT OPPOSITE HEADLINES.</text>
<text x="348" y="342" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THE METRIC CHOICE DECIDES THE STORY.</text>
<text x="44" y="370" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Knepp is a long-rewilded estate; Boothby is a two-year-old ex-arable site, roughly 1,500 acres converting from</text>
<text x="44" y="380.5" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">arable in 2022–23. On within-plot species density and on phylogenetic diversity Knepp leads decisively; on total</text>
<text x="44" y="391" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">species richness the young site overtakes it by 2024. Boothby&#x27;s phylogenetic diversity roughly doubled to 875</text>
<text x="44" y="401.5" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">over the same period. This figure carries register item 15. Pates et al. 2025, read at the preprint.</text>
