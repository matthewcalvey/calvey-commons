<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Dumbbell chart of eleven impact indicators comparing mycelium insulation with conventional insulation, favourable only on climate change and unfavourable on the rest.">

<text x="44" y="58" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">ONE INDICATOR BETTER, TEN WORSE</text>
<line x1="386" y1="86" x2="386" y2="380" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="386" y="80" font-family="'Space Mono',monospace" font-size="8" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">PARITY</text>
<text x="212" y="80" font-family="'Space Mono',monospace" font-size="8" fill="var(--ok,#7AB87A)" text-anchor="start" letter-spacing="0.08em">←  MYCELIUM BETTER</text>
<text x="560" y="80" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="end" letter-spacing="0.08em">MYCELIUM WORSE  →</text>
<text x="202" y="111" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="end" letter-spacing="0.08em">CLIMATE CHANGE</text>
<line x1="386" y1="108" x2="278.12" y2="108" stroke="var(--ok,#7AB87A)" stroke-width="0.75" opacity="0.6"/>
<circle cx="333.8" cy="108" r="3.4" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<circle cx="278.12" cy="108" r="4" fill="var(--ok,#7AB87A)"/>
<text x="202" y="137" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="end" letter-spacing="0.08em">ACIDIFICATION</text>
<line x1="386" y1="134" x2="479.96" y2="134" stroke="var(--hot,#C45C3E)" stroke-width="0.75" opacity="0.6"/>
