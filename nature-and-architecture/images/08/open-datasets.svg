<text x="44" y="396" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Földváry Ličina et al. 2018; Miller et al. 2020; Zagreus et al. 2004; Bannister 2025.</text>
<text x="44" y="407" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Four datasets that exist, are large, and answer a question next to the one the book is asking.</text>
