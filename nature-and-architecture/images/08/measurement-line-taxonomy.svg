<text x="206" y="555" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--dim,#B8B5AC)" text-anchor="start" letter-spacing="0.08em">ANALYTICAL OR METHODOLOGICAL</text>
<text x="44" y="580" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">The numbering is left for the book&#x27;s closing section to fix; this drawing carries names, not numbers.</text>
<text x="44" y="591" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">From the GAPS sections of the forty-one lane files and the run report §02. The reader should see that the</text>
<text x="44" y="602" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">reasons are almost all institutional and almost none technical.</text>
