<line x1="130" y1="246" x2="134" y2="246" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="124" y="249" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">0.8</text>
