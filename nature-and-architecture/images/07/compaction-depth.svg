<text x="84" y="46" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">DEPTH  M</text>
<line x1="120" y1="62" x2="416" y2="62" stroke="var(--ink,#ECEAE3)" stroke-width="1.5"/>
<text x="422" y="65" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">GROUND</text>
<rect x="150" y="131" width="250" height="115" fill="url(#cmp)"/>
<rect x="150" y="131" width="250" height="115" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="422" y="143" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">HEAVILY COMPACTED ON</text>
<text x="422" y="155" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">CONSTRUCTION SITES</text>
<text x="422" y="171" font-family="'Space Mono',monospace" font-size="10" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.04em">0.3 – 0.8 M</text>
<text x="422" y="185" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">NUCLEAR PROBES,</text>
<text x="422" y="197" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">RANDRUP 1997</text>
<rect x="150" y="62" width="250" height="34.5" fill="var(--accent,#6A9CC4)" opacity="0.28"/>
<rect x="150" y="62" width="250" height="34.5" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<text x="158" y="82.25" font-family="'Space Mono',monospace" font-size="9" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.08em">SURFACE NUCLEAR GAUGE VALID TO 0.15 M</text>
<text x="422" y="89.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.08em">AND ONLY BELOW 5 %</text>
<text x="422" y="101.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.08em">ORGANIC MATTER</text>
<line x1="106" y1="96.5" x2="106" y2="246" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="102" y1="96.5" x2="110" y2="96.5" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="102" y1="246" x2="110" y2="246" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="98" y="158.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">WHERE THE</text>
<text x="98" y="170.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">PROBLEM IS</text>
<text x="98" y="182.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">AND THE</text>
<text x="98" y="194.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">INSTRUMENT</text>
<text x="98" y="206.6" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="end" letter-spacing="0.08em">IS NOT</text>
<text x="150" y="316" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">PENETROMETERS UNRELIABLE ON COMPACTED, DRY OR STONY SOIL.</text>
<text x="32" y="340" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Randrup 1997; Randrup 2001. Mulch and gravel lowered bulk density; plywood, the standard</text>
<text x="32" y="351" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">protection, gave no benefit. The instrument cannot reach the depth at which the damage is done.</text>
</svg>
