<text x="44" y="352" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">930 m², 77 employees, 54 workstations, at Royal Wootton Bassett. Dashed lines carry only the endpoints the paper</text>
<text x="44" y="363" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">reports; the intermediate values for those three measures are not published. Every self-rated task worsened, and</text>
<text x="44" y="374" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">the nature sounds masked speech worse than the plain noise did. The authors&#x27; explanation is the lesson: water with</text>
<text x="44" y="385" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">no visible water element is heard as lavatories and running plumbing. Job satisfaction had not recovered when</text>
<text x="44" y="396" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">the plain masker was restored. Hongisto, Varjo, Oliva, Haapakangas and Benway 2017.</text>
