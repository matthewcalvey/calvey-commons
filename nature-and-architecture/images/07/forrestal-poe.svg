<text x="113.5" y="174" font-family="'Space Mono',monospace" font-size="11" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.04em">339 LX</text>
<text x="44" y="188" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">BASELINE  →  AFTER RETROFIT</text>
<text x="44" y="216" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">WANTED BETTER LIGHTING</text>
<text x="44" y="236" font-family="'Space Mono',monospace" font-size="11" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.04em">42 %</text>
<line x1="84" y1="232" x2="112" y2="232" stroke="var(--accent,#6A9CC4)" stroke-width="1.5"/>
<path d="M 107 228 L 113 232 L 107 236" fill="none" stroke="var(--accent,#6A9CC4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122" y="236" font-family="'Space Mono',monospace" font-size="11" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.04em">≈ 15 %</text>
<text x="44" y="250" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">BASELINE  →  AFTER RETROFIT</text>
<text x="328" y="92" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">RELATIVE HUMIDITY</text>
<line x1="328" y1="144" x2="524" y2="144" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<line x1="338.89" y1="144" x2="338.89" y2="148" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="338.89" y="159" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">10</text>
<line x1="393.33" y1="144" x2="393.33" y2="148" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="393.33" y="159" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">20</text>
