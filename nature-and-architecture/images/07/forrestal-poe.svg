<text x="447.78" y="159" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">30</text>
<line x1="502.22" y1="144" x2="502.22" y2="148" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="502.22" y="159" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">40</text>
<rect x="447.78" y="122" width="76.22" height="22" fill="var(--ok,#7AB87A)" opacity="0.18"/>
<line x1="447.78" y1="110" x2="447.78" y2="144" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<text x="451.78" y="106" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--ok,#7AB87A)" text-anchor="start" letter-spacing="0.08em">RECOMMENDED FLOOR</text>
<circle cx="431.44" cy="133" r="3.6" fill="var(--mut,#8A8880)"/>
<line x1="431.44" y1="133" x2="360.67" y2="133" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<circle cx="360.67" cy="133" r="4.2" fill="var(--hot,#C45C3E)"/>
<text x="437.44" y="124" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.04em">27 %</text>
<text x="360.67" y="124" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" text-anchor="middle" letter-spacing="0.04em">14 %</text>
<text x="328" y="176" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">THE MEASUREMENT CROSSES THE LINE</text>
<text x="328" y="187" font-family="'Space Mono',monospace" font-size="8" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">NOBODY WAS WATCHING.</text>
<text x="328" y="214" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">LUMINAIRES ENERGISED</text>
<text x="328" y="234" font-family="'Space Mono',monospace" font-size="11" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.04em">72 %</text>
<line x1="372" y1="230" x2="400" y2="230" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<path d="M 395 226 L 401 230 L 395 234" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="410" y="234" font-family="'Space Mono',monospace" font-size="11" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.04em">98 %</text>
<text x="328" y="250" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">FEWER LAMPS INSTALLED, MORE OF THEM</text>
<text x="328" y="260" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ON — THE REBOUND, IN OPERATION.</text>
<text x="328" y="286" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">THERMAL COMFORT UNCHANGED, AND</text>
<text x="328" y="297" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">STILL THE LIVE COMPLAINT.</text>
<text x="328" y="317" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">WINDOWLESS OFFICES RATED WORSE ON</text>
<text x="328" y="328" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">EVERY ENVIRONMENTAL CATEGORY.</text>
<rect x="44" y="288" width="238" height="42" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="54" y="305" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">MARGIN NOTE:  LAMP DENSITY 0.69 → 0.42</text>
<text x="54" y="317" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">PER m², ABOUT 39 %, AGAINST A</text>
<text x="54" y="327" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">STATED 68 %.  BOTH RECORDED.</text>
<text x="44" y="356" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">350 offices from basement to eighth floor; baseline March 1993, follow-up winter 1993–94; calibrated photometers</text>
<text x="44" y="367" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">and chromameters at 100 then 75 workstations; 244 then 220 questionnaires. Season is confounded. Three things</text>
<text x="44" y="378" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">no prediction could have produced: the evaluation caught what the project was not about, the rebound appeared in</text>
<text x="44" y="389" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">operation, and windowlessness depressed the whole assessment. The report does not say what was done about the</text>
<text x="44" y="400" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">humidity. NIST Internal Report 5591, Sanders and Collins 1995.</text>
</svg>
