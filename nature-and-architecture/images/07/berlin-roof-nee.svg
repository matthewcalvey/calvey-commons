<text x="44" y="391" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">leaving arisings was doing grounds work, and nobody had told them it was a carbon and dead-load decision.</text>
<text x="44" y="402" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">One roof of a size only an airport provides; the carbon comparison is two points. Markolf and Weber 2026.</text>
