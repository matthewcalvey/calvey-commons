<text x="74" y="358" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">CORRECTING THE CORE ANOMALY TOOK ITS SPREAD FROM 32 POINTS TO 3.</text>
<text x="74" y="380" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Same grid height and spacing, transmittance, reflectance, bounce count, weather file and occupied hours.</text>
<text x="74" y="390.5" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Sefaira could not accept custom reflectance, spacing, bounces or weather. The engine&#x27;s stated uncertainty</text>
<text x="74" y="401" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">is plus 15 to 20 per cent. One author, one practice, one geometry; a reproducibility test, not an accuracy</text>
<text x="74" y="411.5" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">test. No inter-laboratory round robin exists. Rockwell 2020, Denver TMY.</text>
