<rect x="44" y="292" width="552" height="26" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="56" y="309" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">ALL DELOSPERMA TAXA FAILED.</text>
<text x="44" y="338" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The growth forms that give a roof its flowering appearance — the forbs — have the lowest measured longevity,</text>
<text x="44" y="349" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">and they are the categories the planting schedule is longest in. Woody shrubs and succulents, the least showy</text>
<text x="44" y="360" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">of the five, hold. Twelve years on one Denver roof, 2007–2019. Schneider, Landis and Bousselot 2021.</text>
</svg>
