<rect x="44" y="296" width="552" height="28" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="56" y="314" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">ABOUT 810 TO 860 kWh OF THE TOTAL IS UNACCOUNTED FOR IN THIS EXTRACTION.</text>
<text x="44" y="346" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The largest single error is in heating and cooling — exactly the end use an architect&#x27;s envelope decisions govern.</text>
<text x="44" y="357" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The three under-predicted end uses are envelope and plant; the three over-predicted are plug and switch, where</text>
<text x="44" y="368" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">the design team has least control and the occupant has most. NIST Special Publication 1182.</text>
