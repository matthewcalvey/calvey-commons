<text x="336" y="340" font-family="'Space Mono',monospace" font-size="9" fill="var(--ok,#7AB87A)" text-anchor="start" letter-spacing="0.08em">INCREASINGLY SUCCESSFUL</text>
<text x="78" y="372" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Razzaghmanesh and colleagues 2018. Permeable paving decays from the day it is laid;</text>
<text x="78" y="383" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">the maintenance contract is part of the hydraulic design, not an afterthought.</text>
