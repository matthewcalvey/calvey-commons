<line x1="377.8" y1="200" x2="377.8" y2="205" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="377.8" y="218" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">20</text>
