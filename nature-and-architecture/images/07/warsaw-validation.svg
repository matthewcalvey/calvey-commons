<text x="52" y="374" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">One engine predicted 204 per cent brighter than measured in the back row under overcast sky; another predicted</text>
