<text x="52" y="396" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">standardised without it. Rucińska and Trząski 2020, Warsaw, 2018–19.</text>
