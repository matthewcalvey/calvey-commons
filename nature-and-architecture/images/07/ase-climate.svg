<text x="502" y="248" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">QUESTION.</text>
<text x="52" y="358" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The survey behind the cap asked whether daylight was ever too bright, in Sacramento, Seattle and Albany, and</text>
<text x="52" y="369" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">addressed neither climate, thermal comfort nor energy. The optima combine visual comfort, thermal comfort and</text>
<text x="52" y="380" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">energy. At the New York Times building 42 per cent of occupants who overrode automated shades chose to reduce</text>
<text x="52" y="391" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">sunlight further, while other research found most participants admitting direct sun when available; both behaviours</text>
<text x="52" y="402" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">are real and opposite. Abboushi 2020; all values simulated.</text>
</svg>
