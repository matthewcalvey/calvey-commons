<text x="56" y="322" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">144 pots in twelve rows, 1.5 L each, three substrates, two irrigation regimes at 133 and 100 mL per pot per day,</text>
<text x="56" y="333" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">eighteen months over two summers. Overall survival 102 of 144. Species choice beat system choice; a single</text>
<text x="56" y="344" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">irrigation zone cannot serve both ends of a wall. Bustami, Beecham and Hopeward 2023, Adelaide.</text>
