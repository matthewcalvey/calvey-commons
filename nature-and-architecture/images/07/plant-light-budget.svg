<text x="520" y="236" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">8</text>
<text x="106" y="252" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">DISTANCE FROM THE GLASS  ·  M</text>
<text x="52" y="300" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The interiorscape maintenance levels were answered in 1992 and have not been re-measured since: growth was</text>
<text x="52" y="311" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">better at about 1,610 lux than at about 810 for all six tested species except three, and spectrum does not matter</text>
<text x="52" y="322" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">once total photosynthetically active radiation is matched. Acclimatisation re-tunes plant metabolism over about</text>
<text x="52" y="333" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">fifteen weeks, which is why handover is the mortality window. The lux conversions are source-dependent and must</text>
<text x="52" y="344" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">be captioned as such. Conover and Poole 1992; measured medians from Kolberg and colleagues 2021. No measured</text>
<text x="52" y="355" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">interior plant mortality or replacement rate in occupied buildings exists anywhere in the indexed record.</text>
</svg>
