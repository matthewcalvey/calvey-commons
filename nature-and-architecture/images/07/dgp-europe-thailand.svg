<text x="52" y="336" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Occupants in eight Bangkok open-plan offices reported discomfort at values a European standard calls</text>
