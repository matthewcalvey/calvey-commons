<text x="380" y="72" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">HAZARD ROUGHLY HALVES IN FOUR YEARS</text>
<text x="66" y="316" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">A single street-tree mortality rate is meaningless without an age band: the boulevard&#x27;s 34 per cent</text>
<text x="66" y="327" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">dead at two years and Philadelphia&#x27;s 22.9 per cent dead at four are not the same quantity. The two</text>
<text x="66" y="338" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">panels come from different populations and do not reconcile arithmetically: see the note below.</text>
<text x="66" y="349" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">The four annual rates and the four cumulative survivals are from different sources and do not</text>
<text x="66" y="360" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">multiply out to each other. Roman, Berland, Nix and Dentice 2026; Nowak, McBride and Beatty 1990;</text>
<text x="66" y="371" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Hilbert and colleagues 2019 as cited in Roman and colleagues.</text>
</svg>
