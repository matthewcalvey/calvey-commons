<text x="24" y="303" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">A radiant quantity at one point, a radiant quantity in a model, an air temperature and an area average</text>
