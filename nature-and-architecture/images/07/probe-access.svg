<text x="546" y="186" font-family="'Space Mono',monospace" font-size="7.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">NOT TESTED</text>
<line x1="228" y1="216" x2="312" y2="216" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="412" y1="216" x2="496" y2="216" stroke="var(--ok,#7AB87A)" stroke-width="1.5"/>
<text x="44" y="244" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">SAME JOURNAL, SAME ISSUE, OVERLAPPING AUTHORS, QUERIED IN THE SAME MINUTE.</text>
<text x="44" y="262" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">THE CONCLUSIONS ARE READABLE AND THE ENERGY NUMBERS ARE NOT.</text>
<text x="44" y="292" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The enclosure is selective, and what it encloses is the measurements. All twelve PROBE papers were located to</text>
<text x="44" y="303" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">page and DOI and none was openable by four routes. Semantic Scholar records for the Probe 3 and Probe 5</text>
<text x="44" y="314" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">synthesis papers, queried 2026-09-21. The four untested blocks are marked as untested, not as closed.</text>
</svg>
