<rect x="412" y="76" width="84" height="128" fill="var(--ok,#7AB87A)" stroke="var(--ok,#7AB87A)" stroke-width="1.5" opacity="0.22"/>
<text x="454" y="96" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="middle" letter-spacing="0.08em">PROBE 5</text>
