<rect x="340" y="234" width="292" height="30" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="56" y="330" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">The cost is one number from one study; the returns are several numbers from several.</text>
<text x="56" y="341" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Both sides of the ledger are as reported in the review, not re-derived. Where a figure is</text>
<text x="56" y="352" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">simulated the bar says so. Figures reported in Ribeiro, Ramos and Flores-Colen 2020;</text>
<text x="56" y="363" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">source studies 2000–2017.</text>
</svg>
