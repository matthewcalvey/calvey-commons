<text x="44" y="403" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">Elsevier abstracts are null in the index and the building-science journals most likely to hold the measurements</text>
