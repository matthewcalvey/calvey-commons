<circle cx="507" cy="123" r="3.2" fill="var(--dim,#B8B5AC)"/>
<text x="496" y="136" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--dim,#B8B5AC)" text-anchor="start" letter-spacing="0.08em">GROUND COVER</text>
<text x="496" y="160" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">COOLING APPEARS AT</text>
<text x="496" y="171" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">ONE DISTANCE, FOR ONE</text>
<text x="496" y="182" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">VARIANT, AND MOVES</text>
<text x="496" y="193" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">VARIANT AT THE NEXT.</text>
<text x="52" y="312" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Positions inside the band are the source&#x27;s significance categories, not reported magnitudes: the only air</text>
<text x="52" y="322.5" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">magnitude the paper states is the roughly 2 K above ambient at 150 cm on the north and east walls.</text>
<text x="52" y="333" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Vegetation surfaces averaged 0.6 K warmer than the air across the campaign and reached 3.6 K warmer.</text>
<text x="52" y="343.5" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Four textile walls and a bare control at Hochschule Geisenheim, 49°59′ N. Stollberg and von Birgelen 2023.</text>
<text x="52" y="354" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">The authors propose shading, not evapotranspiration, as the mechanism — a substitution, not a correction.</text>
</svg>
