<text x="44" y="334" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">The field outcome is decisive and reachable. The dimension an architect must draw — how far apart the</text>
