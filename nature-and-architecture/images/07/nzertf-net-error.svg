<text x="44" y="336" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">A federal test house, sub-metered for a year, against a model published before the demonstration year. There were</text>
<text x="44" y="347" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">no occupants. The error in a net quantity is the sum of the component errors divided by a small number, and the</text>
<text x="44" y="358" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">net quantity is what the building was designed to deliver. The third pair is on the same axis as the first two; that</text>
<text x="44" y="369" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">is the whole point of the drawing. NIST Special Publication 1182, Kneifel, Payne, Ullah and Ng 2015.</text>
</svg>
