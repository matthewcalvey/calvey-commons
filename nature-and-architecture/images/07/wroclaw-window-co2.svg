<text x="556" y="252" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="middle" letter-spacing="0.08em">MV</text>
<line x1="490" y1="238" x2="572" y2="238" stroke="var(--mut,#8A8880)" stroke-width="0.75"/>
<text x="44" y="316" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Six houses in Wrocław, logged 2021–22. The dwellings whose indoor air quality depended on somebody opening</text>
<text x="44" y="327" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">a window opened windows least, and the dwellings that did not depend on it opened them most. The behaviour a</text>
<text x="44" y="338" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">natural-ventilation strategy assumes is measured here, and it is not there.</text>
<text x="44" y="349" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Baborska-Narożny and Kostka 2022.</text>
</svg>
