<text x="269.5" y="299" font-family="'Space Mono',monospace" font-size="9" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.08em">SIGNIFICANT REDUCTION IN MEAN RADIANT AND</text>
<text x="269.5" y="311" font-family="'Space Mono',monospace" font-size="9" fill="var(--accent,#6A9CC4)" text-anchor="start" letter-spacing="0.08em">GLOBE TEMPERATURE BETWEEN 0.5 AND 2.0</text>
<text x="269.5" y="326" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">2.0 – 3.5  NO SIGNIFICANT FURTHER EFFECT</text>
<text x="70" y="356" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">The breeze doing the thermal work sits entirely below the standing threshold. Two regulatory traditions are</text>
<text x="70" y="367" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">calibrated on one axis without reference to each other. Both authoritative wind papers sit inside a purchased</text>
<text x="70" y="378" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">standard; the thresholds are recovered sideways from Gür and Karadag 2024. Thermal band: Sangkertadi 2017.</text>
