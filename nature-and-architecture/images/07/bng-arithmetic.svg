<text x="390" y="328" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em" opacity="0.78">Rampling and colleagues 2023</text>
<rect x="44" y="346" width="552" height="34" fill="none" stroke="var(--line,#32352F)" stroke-width="0.75"/>
<text x="56" y="361" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">GRADE:  REQUIREMENT / ANALYTICAL.  NO ELEMENT OF THE CALCULATION IS</text>
