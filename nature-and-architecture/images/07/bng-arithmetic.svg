<text x="64" y="304" font-family="'Space Mono',monospace" font-size="11" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.04em">27 %</text>
<text x="110" y="304" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" text-anchor="start" letter-spacing="0.08em">OF UNITS IN GOVERNANCE GAPS</text>
<text x="390" y="304" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em" opacity="0.78">zu Ermgassen and colleagues 2021</text>
<line x1="44" y1="323" x2="53" y2="323" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<line x1="48.5" y1="325" x2="48.5" y2="332" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="1.5 2"/>
<text x="64" y="328" font-family="'Space Mono',monospace" font-size="11" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.04em">21 %</text>
