<text x="44" y="408" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.04em" opacity="0.78">Side note: the preprint&#x27;s figures differ from the published ones; the published figures are drawn here.</text>
