<text x="44" y="382" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">All fifteen nursing homes with dedicated long-term dementia units in Bergen, 60.39° N — a complete population.</text>
<text x="44" y="393" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">315 spectrometer readings, seven positions per home, vertical at 1.2 m in four gaze directions. Only 15 per cent</text>
<text x="44" y="404" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">of the variance lay between buildings, so which chair matters more than which building; and at sixty degrees north</text>
<text x="44" y="415" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">the winter interior has no day. Kolberg, Pallesen, Hjetland, Nordhus, Thun and Flo-Groeneboom 2021.</text>
