<rect x="353.02" y="198.72" width="98.76" height="21.76" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="1.5"/>
<text x="402.4" y="190.72" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="middle" letter-spacing="0.08em">THE OLDEST ROOFS</text>
<text x="402.4" y="231.2" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" text-anchor="middle" letter-spacing="0.04em">39.7 – 53.3 MM</text>
<line x1="162.55" y1="124" x2="444.73" y2="210.4" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="4 4"/>
<rect x="102.58" y="226.4" width="196" height="40" fill="none" stroke="var(--mut,#8A8880)" stroke-width="0.75" stroke-dasharray="3 3"/>
<text x="110.58" y="241.4" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">NINE ROOFS.  INDIVIDUAL</text>
<text x="110.58" y="252.4" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">COORDINATES ARE NOT REPORTED</text>
<text x="110.58" y="263.4" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">IN THE SOURCE — CLUSTERS ONLY.</text>
<text x="498" y="96" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">SIX BY ZINCO,</text>
<text x="498" y="107" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">THREE BY OTHERS,</text>
<text x="498" y="118" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">INSTALLED IN THE</text>
<text x="498" y="129" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.08em">EARLY 1980s.</text>
<text x="498" y="156" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">MAINTENANCE</text>
<text x="498" y="167" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">CONTRACTS NOT</text>
<text x="498" y="178" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">RENEWED, EARLY</text>
<text x="498" y="189" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">1990s.</text>
<text x="498" y="216" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">ORIGINAL</text>
<text x="498" y="227" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">SPECIFICATIONS</text>
<text x="498" y="238" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--hot,#C45C3E)" text-anchor="start" letter-spacing="0.08em">LOST.</text>
<text x="44" y="316" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">A roof specified at eighty or a hundred millimetres is not that roof at year twenty-five. It drifts out of the standard</text>
<text x="44" y="327" font-family="'Space Mono',monospace" font-size="8" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.03em" opacity="0.92">by doing nothing, and no inspection regime in general practice would detect it. There is no baseline: the original</text>
<text x="44" y="338" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.02em" opacity="0.92">depths, compositions and species lists are gone, which is itself a finding about record-keeping. Organic content</text>
<text x="44" y="349" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">exceeded the FLL limits on four of the nine, and composition simplified toward Sedum with age.</text>
<text x="44" y="360" font-family="'Space Mono',monospace" font-size="8.5" fill="var(--mut,#8A8880)" text-anchor="start" letter-spacing="0.05em" opacity="0.92">Thuring and Dunnett 2014; surveyed 2010–11 in twelve to eighteen quadrats per roof.</text>
</svg>
