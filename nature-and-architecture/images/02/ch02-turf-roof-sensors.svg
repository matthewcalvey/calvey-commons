<text x="58.0" y="300.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">WITH THE INNER SENSOR AT 20 TO 24 CM DEPTH, THE DIFFERENCE BETWEEN OUTER AND INNER</text>
<text x="58.0" y="314.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">WAS ONLY 1 TO 3 DEGREES WHILE THE OUTER SURFACE FLUCTUATED.</text>
<text x="58.0" y="336.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">READ ONE WAY THAT IS REMARKABLE DAMPING; READ ANOTHER IT SHOWS NO LARGE STEADY-STATE</text>
<text x="58.0" y="350.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DIFFERENCE ACROSS THE LAYER. THE PAPER DOES NOT RESOLVE WHICH, AND NEITHER DOES THIS FIGURE.</text>
<rect x="58.0" y="366.0" width="554.0" height="24.0" fill="none" stroke="var(--hot,#C45C3E)" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="70.0" y="382.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--hot,#C45C3E)" letter-spacing="0.08em">NO U-VALUE AND NO THERMAL CONDUCTIVITY FOR ICELANDIC TURF EXISTS IN PRINT.</text>
<text x="58.0" y="412.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">TEETER ET AL. · OCTOBER 2024 – FEBRUARY 2025 · THE KELDUR HUMIDITY LOGGERS FAILED AND READ 100 %</text>
<text x="58.0" y="34.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">TURF AT TWO FARMS OF ONE TRADITION, DRAWN AT ONE SCALE</text>
<text x="58.0" y="52.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">A TWO-AND-A-HALF-FOLD DIFFERENCE IN THICKNESS BETWEEN TWO FARMS OF ONE TRADITION</text>
