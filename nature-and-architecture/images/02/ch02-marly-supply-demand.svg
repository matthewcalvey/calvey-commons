<text x="30.0" y="336.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">MACHINE DE MARLY · FOURTEEN WHEELS OF 11.9 M · OVER 250 PUMPS · A LIFT OF 162 M</text>
