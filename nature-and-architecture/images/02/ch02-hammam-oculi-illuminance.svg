<text x="58.0" y="368.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">DAYLIGHT FACTORS BELOW 2 PER CENT · DAILY RANGE 10 TO 60 LUX · SIBLEY 2018</text>
<text x="58.0" y="396.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">THE AUTHOR ARGUES THESE VERY LOW LEVELS ARE AN AUTHENTIC QUALITY TO BE CONSERVED,</text>
<text x="58.0" y="410.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">AND NO PUBLISHED SOURCE ARGUES THE OTHER WAY: THE CONFLICT IS WITH A STANDARD,</text>
<text x="58.0" y="424.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--ink,#ECEAE3)" letter-spacing="0.08em">NOT WITH A SCHOLAR.</text>
