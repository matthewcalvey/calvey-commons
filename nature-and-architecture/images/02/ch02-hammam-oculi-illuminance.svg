<text x="58.0" y="312.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">WHAT THIS FIGURE PLOTS AS NUMBERS IS THE CEILING, THE MEAN AND THE FALL.</text>
<text x="58.0" y="326.0" font-family="'Space Mono',monospace" font-size="9" fill="var(--mut,#8A8880)" letter-spacing="0.08em">THE SHAPE BETWEEN THEM IS THE REPORTED BEHAVIOUR, NOT A PUBLISHED SERIES.</text>
